<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小金井市 水害サバイバルクイズ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:#0b2a45;color:#1d2b36;min-height:100vh;transition:background .4s}
  body.oni{background:#140507}
  button{-webkit-appearance:none;appearance:none;color:inherit}
  ruby rt{font-size:.45em;font-weight:normal;letter-spacing:-.06em}
  .app{max-width:1000px;margin:0 auto;padding:18px;min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease;position:relative}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:34px;color:#fff;text-align:center;line-height:1.6}
  .sub{color:#cfe3f5;text-align:center;font-size:18px;margin:10px 0 18px;line-height:2}
  .start-hero{border-radius:18px;overflow:hidden;margin-bottom:18px;line-height:0}
  .btn{display:block;width:100%;border:none;border-radius:14px;font-size:21px;font-weight:bold;padding:16px;cursor:pointer;font-family:inherit;line-height:1.8}
  .btn-primary{background:#ff8a00;color:#fff;-webkit-text-fill-color:#fff;box-shadow:0 5px 0 #c26900}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c26900}
  .btn-sub{background:#e3e8ee;color:#0b2a45;-webkit-text-fill-color:#0b2a45;box-shadow:0 5px 0 #b3c0cc}
  .head-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;min-height:38px}
  .furi,.snd{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);color:#fff;-webkit-text-fill-color:#fff;border-radius:22px;padding:6px 12px;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:bold}
  .furi.on{background:#ffd60a;color:#0b2a45;-webkit-text-fill-color:#0b2a45;border-color:#ffd60a}
  .lv-label{color:#fff;font-size:22px;font-weight:bold;text-align:center;margin:4px 0 12px;line-height:1.8}
  .lv-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .lv-btn{border:none;border-radius:18px;padding:18px 12px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.7;color:#fff;-webkit-text-fill-color:#fff}
  .lv-btn .n{font-size:30px;font-weight:900;display:block;line-height:1.6}
  .lv-btn .d{font-size:14px;display:block;margin-top:4px;line-height:1.9}
  .lv-easy{background:#38b000;box-shadow:0 6px 0 #237000}
  .lv-hard{background:#d62828;box-shadow:0 6px 0 #8b0000}
  .lv-oni{background:linear-gradient(160deg,#1a1a1a,#3b0000);box-shadow:0 6px 0 #000,0 0 0 2px #d62828 inset}
  .lv-oni .n{color:#ff3b3b;-webkit-text-fill-color:#ff3b3b;letter-spacing:.05em;text-shadow:0 0 12px rgba(255,0,0,.6)}
  .lv-btn:active{transform:translateY(4px);box-shadow:none}
  .lvtag{display:inline-block;font-size:16px;padding:3px 14px;border-radius:16px;color:#fff;margin-bottom:6px;line-height:1.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .sc-btn{background:#fff;border:4px solid transparent;border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;font-family:inherit;transition:.15s;color:#0b2a45}
  .sc-btn:active{border-color:#ff8a00;transform:scale(.97)}
  .sc-btn .ic{font-size:52px}
  .sc-btn .t{font-size:20px;font-weight:bold;margin-top:6px;color:#0b2a45;-webkit-text-fill-color:#0b2a45;line-height:1.8}
  .sc-btn .d{font-size:14px;color:#3d4f61;-webkit-text-fill-color:#3d4f61;margin-top:4px;line-height:1.8}
  body.oni .sc-btn{background:#241012;border-color:#5a1a1a}
  body.oni .sc-btn .t{color:#ffdada;-webkit-text-fill-color:#ffdada}
  body.oni .sc-btn .d{color:#d8a8a8;-webkit-text-fill-color:#d8a8a8}
  .back{background:none;border:none;color:#9db7cf;-webkit-text-fill-color:#9db7cf;font-size:17px;margin-top:16px;cursor:pointer;font-family:inherit;text-decoration:underline}
  .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .topbar .sc{font-size:18px;font-weight:bold;line-height:1.8}
  .progress{flex:1;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;min-width:80px;max-width:300px}
  .progress div{height:100%;background:#ff8a00;transition:width .4s}
  body.oni .progress div{background:#ff2a2a}
  .qno{font-size:18px;font-weight:bold;white-space:nowrap;line-height:1.8}
  .tools{display:flex;gap:6px}
  .scene{width:100%;border-radius:16px;overflow:hidden;background:#000;line-height:0;position:relative}
  .scene svg,.scene img,.scene video{width:100%;height:auto;display:block}
  .scene.shake{animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  .rainfall{animation:fall .38s linear infinite}
  @keyframes fall{from{transform:translate(0,-120px)}to{transform:translate(-40px,0)}}
  .wave{animation:wave 2.4s linear infinite}
  .wave.fast{animation-duration:1.1s}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
  .bob{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .spinw{animation:spinw 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spinw{to{transform:rotate(360deg)}}
  .drop{animation:drop 1.4s linear infinite}
  @keyframes drop{from{transform:translate(0,-40px);opacity:1}to{transform:translate(-30px,120px);opacity:.2}}
  .pour{animation:pour .6s linear infinite}
  @keyframes pour{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
  .flash{opacity:0;transition:opacity .08s}
  .flash.on{opacity:.75}
  .situation{background:#fff6e0;border-left:8px solid #ff8a00;border-radius:10px;padding:12px 16px;margin:14px 0 10px;font-size:19px;line-height:2;color:#1d2b36}
  body.oni .situation{background:#2a0e10;border-left-color:#ff2a2a;color:#ffe3e3}
  .question{font-size:24px;font-weight:bold;color:#fff;margin:6px 2px 12px;line-height:2}
  .choices{display:flex;flex-direction:column;gap:12px}
  .choice{background:#fff;border:none;border-radius:14px;padding:16px 18px 16px 64px;font-size:19px;font-weight:600;text-align:left;position:relative;cursor:pointer;font-family:inherit;line-height:2;box-shadow:0 4px 0 #9fb3c4;color:#1a1a1a;-webkit-text-fill-color:#1a1a1a}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3c4;background:#ffe7c7}
  .choice .lb{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#0b2a45;color:#fff;-webkit-text-fill-color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
  body.oni .choice .lb{background:#8b0000}
  #s-drama{justify-content:center}
  .drama-title{color:#fff;font-size:26px;font-weight:bold;text-align:center;margin-bottom:12px;letter-spacing:.1em;line-height:2}
  .drama-title.beat{animation:beat .8s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .drama-wrap{position:relative}
  .caption{position:absolute;left:0;right:0;bottom:18px;text-align:center;line-height:1.9;pointer-events:none}
  .caption span{display:inline-block;background:rgba(0,0,0,.6);color:#fff;font-size:32px;font-weight:900;padding:6px 26px;border-radius:12px;opacity:0;animation:capin .8s ease forwards .6s}
  @keyframes capin{to{opacity:1}}
  .rise{animation:rise 3.8s cubic-bezier(.5,0,.8,.6) forwards}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
  .fadeout{animation:fadeout 3s ease forwards}
  @keyframes fadeout{to{opacity:0}}
  .fadein{opacity:0;animation:fadein 2s ease forwards 1.2s}
  @keyframes fadein{to{opacity:1}}
  .drift{animation:drift 6s ease-out forwards}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(70px)}}
  .rock{animation:rock 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-5px)}}
  .waveArm{animation:waveArm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left bottom}
  @keyframes waveArm{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
  .float{animation:float 6s ease-in-out forwards}
  @keyframes float{from{transform:translate(-60px,-30px)}to{transform:translate(80px,30px)}}
  .spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{from{transform:rotate(-20deg)}to{transform:rotate(30deg)}}
  .swimR{animation:swimR linear infinite}
  .swimL{animation:swimL linear infinite}
  @keyframes swimR{from{transform:translateX(-120px)}to{transform:translateX(780px)}}
  @keyframes swimL{from{transform:translateX(780px)}to{transform:translateX(-120px)}}
  .bubble{animation:bubble linear infinite}
  @keyframes bubble{from{transform:translateY(0);opacity:.8}to{transform:translateY(-380px);opacity:0}}
  .sway{animation:sway 3s ease-in-out infinite alternate}
  @keyframes sway{from{opacity:.05}to{opacity:.16}}
  .darken{opacity:0;animation:darken 5.5s ease forwards .5s}
  @keyframes darken{to{opacity:.5}}
  .result-head{text-align:center;padding:26px 16px;border-radius:18px;color:#fff;line-height:1.8}
  .pass{background:linear-gradient(135deg,#1e9e5a,#38c172)}
  .fail{background:linear-gradient(135deg,#8b0000,#d62828);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,40,40,.7)}50%{box-shadow:0 0 0 14px rgba(214,40,40,0)}}
  .score{font-size:84px;font-weight:900;line-height:1.1}
  .score small{font-size:30px}
  .verdict{font-size:30px;font-weight:bold;margin-top:8px;line-height:1.8}
  .warn{font-size:19px;margin-top:10px;line-height:2}
  .review{margin-top:16px}
  .review h3{font-size:21px;margin-bottom:10px;color:#0b2a45;line-height:1.9}
  .rv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e3e8ee;font-size:17px;line-height:2;color:#1d2b36}
  .rv:last-child{border-bottom:none}
  .rv .sit{display:block;font-size:15px;color:#5b6b7a;margin-bottom:2px}
  .mk{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff}
  .mk.g{background:#1e9e5a}.mk.m{background:#f0a500}.mk.b{background:#d62828}
  .rv b{color:#0b2a45}
  .adv{color:#a33a00}
  .btn-row{display:flex;gap:12px;margin-top:18px}
  .note{color:#9db7cf;font-size:13px;text-align:center;margin-top:16px;line-height:2}
  @media (max-width:520px){h1{font-size:27px}.question{font-size:21px}.choice{font-size:17px}.situation{font-size:17px}.btn-row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="s-start">
    <div class="head-row"><button class="furi" onclick="toggleFuri()"></button></div>
    <h1>🌧️ <span data-k="common.title"></span></h1>
    <p class="sub" data-k="common.sub"></p>
    <div class="start-hero" id="hero"></div>
    <div class="lv-label" data-k="common.lvLabel"></div>
    <div class="lv-row">
      <button class="lv-btn lv-easy" onclick="chooseLevel('easy')"><span class="n" data-k="common.easyN"></span><span class="d" data-k="common.easyD"></span></button>
      <button class="lv-btn lv-hard" onclick="chooseLevel('hard')"><span class="n" data-k="common.hardN"></span><span class="d" data-k="common.hardD"></span></button>
      <button class="lv-btn lv-oni" onclick="chooseLevel('oni')"><span class="n">👹 <span data-k="common.oniN"></span></span><span class="d" data-k="common.oniD"></span></button>
    </div>
    <p class="note" data-k="common.note"></p>
  </section>

  <section class="screen" id="s-select">
    <div class="head-row"><button class="furi" onclick="toggleFuri()"></button></div>
    <div style="text-align:center"><span class="lvtag" id="sel-tag"></span></div>
    <h1 style="font-size:28px" id="sel-h"></h1>
    <p class="sub" id="sel-sub"></p>
    <div class="grid" id="sc-grid"></div>
    <button class="back" id="sel-back" onclick="go('s-start')"></button>
  </section>

  <section class="screen" id="s-quiz">
    <div class="topbar">
      <div class="sc" id="q-sc"></div>
      <div class="progress"><div id="q-bar"></div></div>
      <div class="qno" id="q-no"></div>
      <div class="tools"><button class="snd" id="snd-btn" onclick="toggleSound()"></button><button class="furi" onclick="toggleFuri()"></button></div>
    </div>
    <div class="scene" id="q-scene"></div>
    <div class="situation" id="q-sit"></div>
    <div class="question" id="q-text"></div>
    <div class="choices" id="q-choices"></div>
  </section>

  <section class="screen" id="s-drama">
    <div class="drama-title beat" id="d-title"></div>
    <div class="drama-wrap">
      <div class="scene" id="d-scene"></div>
      <div class="caption" id="d-cap"></div>
    </div>
  </section>

  <section class="screen" id="s-result">
    <div class="head-row"><button class="furi" onclick="toggleFuri()"></button></div>
    <div class="result-head" id="r-head"></div>
    <div class="card review">
      <h3 id="r-h3"></h3>
      <div id="r-list"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-sub" id="r-again" onclick="go('s-select')"></button>
      <button class="btn btn-primary" id="r-top" onclick="go('s-start')"></button>
    </div>
  </section>
</div>

<script>
/* =========================================================
   設問・文言データ（ビルド時に埋め込み。漢字《よみ》= ふりがな）

すいそうてい》</b>と確認《かくにん》しました。夜《よる》7時《じ》、<b>警戒《けいかい》レベル3（高齢者等避難《こうれいしゃとうひなん》）</b>が発令《はつれい》。家《いえ》には足《あし》の弱《よわ》い祖母《そぼ》がいます。", "q": "どうする？", "tip": "レベル3は、高齢者《こうれいしゃ》など避難《ひなん》に時間《じかん》がかかる人《ひと》が避難《ひなん》を始《はじ》める段階《だんかい》です。避難指示《ひなんしじ》（レベル4）を待《ま》つと、さらに暗《くら》く雨《あめ》の強《つよ》い中《なか》での移動《いどう》になります。"}, "2m": {"scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}, "c": [{"t": "ハザードマップで避難先《ひなんさき》と経路《けいろ》を確認《かくにん》し、祖母《そぼ》を連《つ》れてすぐ移動《いどう》を始《はじ》める", "s": 2}, {"t": "避難所《ひなんじょ》の場所《ばしょ》を家族《かぞく》で確認《かくにん》し、避難指示《ひなんしじ》が出《で》たら出発《しゅっぱつ》することにする", "s": 1}, {"t": "避難所《ひなんじょ》は混《こ》むので、自宅《じたく》で様子《ようす》を見《み》ることにする", "s": 0}], "sit": "持《も》ち出《だ》し袋《ぶくろ》の準備中《じゅんびちゅう》、夜《よる》7時《じ》に<b>警戒《けいかい》レベル3（高齢者等避難《こうれいしゃとうひなん》）</b>が発令《はつれい》。避難先《ひなんさき》はまだ決《き》めていません。足《あし》の弱《よわ》い祖母《そぼ》がいます。", "q": "どうする？", "tip": "準備《じゅんび》ができていても、避難先《ひなんさき》が決《き》まっていなければ動《うご》けません。レベル3は高齢者《こうれいしゃ》が避難《ひなん》を始《はじ》める段階《だんかい》。決《き》めたらすぐ行動《こうどう》に移《うつ》しましょう。"}, "2b": {"scene": {"type": "house", "rain": 3, "depth": 10, "alert": "l3", "extra": ["grandma"]}, "c": [{"t": "家族《かぞく》にけがを伝《つた》え、親戚《しんせき》や近所《きんじょ》に避難《ひなん》の手助《てだす》けを早《はや》めに頼《たの》み、祖母《そぼ》とともに移動《いどう》を始《はじ》める", "s": 2}, {"t": "けがの手当《てあ》てをしてから、落《お》ち着《つ》いて今後《こんご》を考《かんが》える", "s": 1}, {"t": "痛《いた》みをこらえて、もう一度《いちど》側溝《そっこう》の詰《つ》まりを取《と》りに出《で》る", "s": 0}], "sit": "側溝《そっこう》を掃除中《そうじちゅう》、あふれた水《みず》に足《あし》をすくわれて転倒《てんとう》し、足首《あしくび》を痛《いた》めました。<b>警戒《けいかい》レベル3</b>が発令《はつれい》。足《あし》の弱《よわ》い祖母《そぼ》もいます。", "q": "どうする？", "tip": "大雨《おおあめ》の中《なか》の屋外《おくがい》作業《さぎょう》は転倒《てんとう》・転落《てんらく》の危険大《きけんだい》。避難《ひなん》に支援《しえん》が必要《ひつよう》な人《ひと》が増《ふ》えたら、早《はや》めに周囲《しゅうい》へ助《たす》けを求《もと》めることが大切《たいせつ》です。"}, "3g": {"scene": {"type": "shelter", "rain": 4, "depth": 0, "alert": "l4", "extra": []}, "c": [{"t": "受付《うけつけ》で家族《かぞく》の人数《にんずう》と、祖母《そぼ》に必要《ひつよう》な配慮《はいりょ》（持病《じびょう》・介助《かいじょ》）を伝《つた》える", "s": 2}, {"t": "混《こ》む前《まえ》に、毛布《もうふ》や居場所《いばしょ》を確保《かくほ》しに行《い》く", "s": 1}, {"t": "戸締《とじ》まりが気《き》になるので、一度《いちど》自宅《じたく》に戻《もど》る", "s": 0}], "sit": "祖母《そぼ》と早《はや》めに避難所《ひなんじょ》に到着《とうちゃく》。夜《よる》9時《じ》、<b>警戒《けいかい》レベル4（避難指示《ひなんしじ》）</b>が発令《はつれい》され、避難所《ひなんじょ》に人《ひと》が次々《つぎつぎ》と集《あつ》まってきました。", "q": "避難所《ひなんじょ》で最初《さいしょ》にすべきことは？", "tip": "受付《うけつけ》で要配慮者《ようはいりょしゃ》の情報《じょうほう》を伝《つた》えると、適切《てきせつ》な場所《ばしょ》や支援《しえん》につながります。避難後《ひなんご》に自宅《じたく》へ戻《もど》る途中《とちゅう》で被災《ひさい》する事例《じれい》があります。"}, "3m": {"scene": {"type": "house", "rain": 4, "depth": 15, "alert": "l4", "extra": []}, "c": [{"t": "水《みず》が浅《あさ》く流《なが》れもないうちに、家族《かぞく》で歩《ある》いて近《ちか》くの避難所《ひなんじょ》へ向《む》かう", "s": 2}, {"t": "外《そと》は危《あぶ》ないので、家族《かぞく》全員《ぜんいん》で自宅《じたく》の2階《かい》に上《あ》がって様子《ようす》を見《み》る", "s": 1}, {"t": "祖母《そぼ》を歩《ある》かせるのは大変《たいへん》なので、車《くるま》に乗《の》せて避難所《ひなんじょ》へ向《む》かう", "s": 0}], "sit": "<b>警戒《けいかい》レベル4（避難指示《ひなんしじ》）</b>が発令《はつれい》。家《いえ》の前《まえ》の道路《どうろ》は<b>水深《すいしん》 約《やく》15cm</b>。自宅《じたく》付近《ふきん》は<b>最大《さいだい》2〜3mの浸水想定《しんすいそうてい》</b>です。", "q": "どうする？", "tip": "想定浸水《そうていしんすい》が深《ふか》い場所《ばしょ》では、2階《かい》でも浸《つ》かるおそれがあります。水《みず》が浅《あさ》く流《なが》れのないうちに移動《いどう》を。車《くるま》は水深《すいしん》30cm程度《ていど》でも動《うご》けなくなることがあります。"}, "3b": {"scene": {"type": "house", "rain": 4, "depth": 30, "alert": "l4", "extra": []}, "c": [{"t": "屋外《おくがい》への避難《ひなん》は危険《きけん》と判断《はんだん》し、全員《ぜんいん》で2階《かい》以上《いじょう》へ上《あ》がり、119番《ばん》や親戚《しんせき》に状況《じょうきょう》を伝《つた》える", "s": 2}, {"t": "1階《かい》で貴重品《きちょうひん》や常備薬《じょうびやく》をまとめてから、2階《かい》へ上《あ》がる", "s": 1}, {"t": "祖母《そぼ》を車《くるま》に乗《の》せて、避難所《ひなんじょ》へ向《む》かう", "s": 0}], "sit": "手助《てだす》けを待《ま》つうちに<b>警戒《けいかい》レベル4</b>が発令《はつれい》。家《いえ》の前《まえ》は<b>水深《すいしん》約《やく》30cm</b>で、流《なが》れが出始《ではじ》めています。", "q": "どうする？", "tip": "流《なが》れのある水中《すいちゅう》の移動《いどう》は、車《くるま》でも徒歩《とほ》でも極《きわ》めて危険《きけん》。屋外避難《おくがいひなん》が難《むずか》しくなったら、少《すこ》しでも高《たか》い場所《ばしょ》へ移《うつ》り（緊急安全確保《きんきゅうあんぜんかくほ》）、救助《きゅうじょ》を求《もと》めましょう。"}, "4g": {"scene": {"type": "shelter", "rain": 4, "depth": 0, "alert": "l4", "extra": ["phone"]}, "c": [{"t": "自治体《じちたい》や気象庁《きしょうちょう》など公式情報《こうしきじょうほう》で事実《じじつ》を確認《かくにん》し、171で父《ちち》に安否《あんぴ》を伝《つた》える", "s": 2}, {"t": "SNSの情報《じょうほう》を、家族《かぞく》のグループチャットにすぐ共有《きょうゆう》する", "s": 1}, {"t": "堤防《ていぼう》の様子《ようす》を自分《じぶん》の目《め》で確《たし》かめに行《い》く", "s": 0}], "sit": "避難所《ひなんじょ》で夜《よる》を過《す》ごしています。単身赴任中《たんしんふにんちゅう》の父《ちち》と電話《でんわ》がつながらず、SNSでは真偽不明《しんぎふめい》の「堤防《ていぼう》決壊《けっかい》」情報《じょうほう》が広《ひろ》がっています。", "q": "どうする？", "tip": "災害時《さいがいじ》はデマが拡散《かくさん》しがち。公式情報《こうしきじょうほう》で確認《かくにん》しましょう。電話《でんわ》が不通《ふつう》でも、災害用《さいがいよう》伝言《でんごん》ダイヤル（171）や伝言板《でんごんばん》で安否《あんぴ》を伝《つた》えられます。"}, "4m": {"scene": {"type": "house", "rain": 4, "depth": 40, "alert": "l4", "extra": []}, "c": [{"t": "すぐに2階《かい》以上《いじょう》へ上《あ》がり、119番《ばん》や家族《かぞく》に居場所《いばしょ》を伝《つた》えて救助《きゅうじょ》を待《ま》つ", "s": 2}, {"t": "1階《かい》の貴重品《きちょうひん》や家電《かでん》を2階《かい》へ運《はこ》び上《あ》げてから、2階《かい》に避難《ひなん》する", "s": 1}, {"t": "はぐれないように家族《かぞく》の体《からだ》をひもで結《むす》び、みんなで避難所《ひなんじょ》まで歩《ある》く", "s": 0}], "sit": "避難《ひなん》が遅《おく》れてしまいました。外《そと》は<b>水深《すいしん》 約《やく》40cm</b>で、水《みず》に流《なが》れも出《で》てきています。", "q": "どうする？", "tip": "流《なが》れのある水《みず》は、膝《ひざ》くらいの深《ふか》さでも大人《おとな》が足《あし》をとられます。体《からだ》を結《むす》んでも全員《ぜんいん》が流《なが》される危険《きけん》が高《たか》まるだけ。外《そと》へ出《で》ず、上《うえ》の階《かい》で救助《きゅうじょ》を求《もと》めましょう。"}, "4b": {"scene": {"type": "house", "rain": 4, "depth": 80, "alert": "l5", "extra": []}, "c": [{"t": "119番《ばん》に場所《ばしょ》・人数《にんずう》・要救助者《ようきゅうじょしゃ》（祖母《そぼ》）を伝《つた》え、窓《まど》から白《しろ》い布《ぬの》やライトで居場所《いばしょ》を知《し》らせる", "s": 2}, {"t": "押《お》し入《い》れの上段《じょうだん》など、室内《しつない》の少《すこ》しでも高《たか》い場所《ばしょ》でじっと待《ま》つ", "s": 1}, {"t": "屋根伝《やねづた》いに隣《となり》の家《いえ》へ移《うつ》ろうと、窓《まど》から外《そと》へ出《で》る", "s": 0}], "sit": "2階《かい》に避難《ひなん》しましたが、水《みず》は1階《かい》の天井《てんじょう》近《ちか》くまで上昇《じょうしょう》。<b>警戒《けいかい》レベル5（緊急安全確保《きんきゅうあんぜんかくほ》）</b>が発令《はつれい》され、停電《ていでん》しています。", "q": "どうする？", "tip": "レベル5は命《いのち》の危険《きけん》が迫《せま》る状況《じょうきょう》。水中《すいちゅう》や屋根《やね》の上《うえ》へむやみに出《で》ず、居場所《いばしょ》を目立《めだ》たせて救助《きゅうじょ》を待《ま》ちましょう。電話《でんわ》がつながらなくても、ライトや布《ぬの》で合図《あいず》を。"}, "5g": {"scene": {"type": "house", "rain": 0, "depth": 5, "alert": "stop", "extra": ["breaker"]}, "c": [{"t": "ブレーカーを落《お》としたまま、片付《かたづ》ける前《まえ》に家《いえ》の内外《ないがい》の被害《ひがい》を写真《しゃしん》で記録《きろく》する", "s": 2}, {"t": "ブレーカーを落《お》としてから、衛生《えいせい》のためにすぐ泥《どろ》を掃《は》き出《だ》して消毒《しょうどく》する", "s": 1}, {"t": "暗《くら》くて作業《さぎょう》できないので、ブレーカーを上《あ》げて電気《でんき》がつくか確認《かくにん》する", "s": 0}], "sit": "雨《あめ》がやみ、自宅《じたく》に戻《もど》ると1階《かい》は泥《どろ》だらけ。電気《でんき》は止《と》まっています。", "q": "片付《かたづ》けの前《まえ》に何《なに》をする？", "tip": "浸水《しんすい》した電気設備《でんきせつび》は、通電《つうでん》すると感電《かんでん》や火災《かさい》のおそれがあります。片付《かたづ》ける前《まえ》に被害《ひがい》を写真《しゃしん》で残《のこ》すと、罹災証明書《りさいしょうめいしょ》の申請《しんせい》や保険請求《ほけんせいきゅう》に役立《やくだ》ちます。"}, "5m": {"scene": {"type": "house", "rain": 0, "depth": 20, "alert": "stop", "extra": []}, "c": [{"t": "救助隊《きゅうじょたい》の指示《しじ》に従《したが》い、祖母《そぼ》を優先《ゆうせん》して乗《の》せてもらう", "s": 2}, {"t": "常備薬《じょうびやく》など必要《ひつよう》な物《もの》を2階《かい》で手早《てばや》くまとめてから乗《の》る", "s": 1}, {"t": "待《ま》ちきれず、近《ちか》くまで来《き》たボートへ泳《およ》いで向《む》かう", "s": 0}], "sit": "救助《きゅうじょ》ボートが到着《とうちゃく》しました。祖母《そぼ》は自力《じりき》で歩《ある》けません。", "q": "どうする？", "tip": "救助《きゅうじょ》の場面《ばめん》では隊員《たいいん》の指示《しじ》がすべて。浸水《しんすい》した1階《かい》には漂流物《ひょうりゅうぶつ》や感電《かんでん》の危険《きけん》があります。常備薬《じょうびやく》は普段《ふだん》から持《も》ち出《だ》し袋《ぶくろ》に入《い》れておきましょう。"}, "5b": {"scene": {"type": "house", "rain": 0, "depth": 30, "alert": "stop", "extra": []}, "c": [{"t": "引《ひ》き続《つづ》き2階《かい》にとどまり、公式情報《こうしきじょうほう》と救助《きゅうじょ》の到着《とうちゃく》を待《ま》つ", "s": 2}, {"t": "水《みず》が膝下《ひざした》まで引《ひ》いたら、家族《かぞく》で歩《ある》いて避難所《ひなんじょ》へ向《む》かう", "s": 1}, {"t": "水位《すいい》が下《さ》がったので、すぐ1階《かい》に下《お》りて片付《かたづ》けを始《はじ》める", "s": 0}], "sit": "夜《よる》が明《あ》け、水位《すいい》が下《さ》がり始《はじ》めました。救助《きゅうじょ》はまだ来《き》ていません。", "q": "どうする？", "tip": "水《みず》が引《ひ》き始《はじ》めても、再《ふたた》び雨《あめ》が強《つよ》まる・感電《かんでん》・汚水《おすい》による感染《かんせん》などの危険《きけん》があります。安全《あんぜん》が確認《かくにん》されるまで高《たか》い場所《ばしょ》で待機《たいき》しましょう。"}}}, {"id": "car", "icon": "🚗", "title": "運転《うんてん》しているとき", "desc": "市内《しない》を車《くるま》で走《はし》っている", "nodes": {"1": {"scene": {"type": "car", "rain": 2, "depth": 0, "alert": "warn", "extra": []}, "c": [{"t": "目的地《もくてきち》を変更《へんこう》し、浸水《しんすい》しにくい高《たか》い場所《ばしょ》にある大《おお》きな施設《しせつ》の駐車場《ちゅうしゃじょう》などへ向《む》かう", "s": 2}, {"t": "スピードを落《お》とし、ライトをつけて慎重《しんちょう》に予定《よてい》どおり目的地《もくてきち》へ向《む》かう", "s": 1}, {"t": "大通《おおどお》りの渋滞《じゅうたい》を避《さ》けるため、川沿《かわぞ》いの抜《ぬ》け道《みち》を使《つか》って早《はや》く帰《かえ》る", "s": 0}], "sit": "運転中《うんてんちゅう》、ラジオで小金井市《こがねいし》に<b>大雨警報《おおあめけいほう》</b>が発表《はっぴょう》されたと知《し》りました。", "q": "どうする？", "tip": "大雨《おおあめ》の中《なか》の運転《うんてん》は視界《しかい》が悪《わる》く、道路《どうろ》が急《きゅう》に冠水《かんすい》することもあります。川沿《かわぞ》いや低《ひく》い道《みち》は避《さ》け、早《はや》めに安全《あんぜん》な場所《ばしょ》へ向《む》かいましょう。"}, "2g": {"scene": {"type": "underpass", "rain": 3, "depth": 0, "alert": "l3", "extra": []}, "c": [{"t": "アンダーパスには入《はい》らず、引《ひ》き返《かえ》して高《たか》い道《みち》を通《とお》る迂回《うかい》ルートを探《さが》す", "s": 2}, {"t": "近《ちか》くの路肩《ろかた》に車《くるま》を止《と》め、水《みず》が引《ひ》くまで車内《しゃない》で様子《ようす》を見《み》る", "s": 1}, {"t": "前《まえ》を走《はし》る車高《しゃこう》の高《たか》いSUVが通《とお》れたので、ゆっくり後《あと》について通《とお》る", "s": 0}], "sit": "高《たか》い場所《ばしょ》の施設《しせつ》へ向《む》かう途中《とちゅう》、<b>警戒《けいかい》レベル3</b>が発令《はつれい》。この先《さき》の<b>アンダーパス（立体交差《りったいこうさ》の下《した》の道《みち》）が冠水《かんすい》</b>しています。", "q": "どうする？", "tip": "アンダーパスは見《み》た目《め》より深《ふか》く冠水《かんすい》していることがあり、車《くるま》が動《うご》けなくなって閉《と》じ込《こ》められる事故《じこ》が起《お》きています。低《ひく》い場所《ばしょ》で停《と》まって待《ま》つのも危険《きけん》です。"}, "2m": {"scene": {"type": "underpass", "rain": 3, "depth": 0, "alert": "l3", "extra": []}, "c": [{"t": "引《ひ》き返《かえ》し、高《たか》い道《みち》を通《とお》るルートに自分《じぶん》で切《き》り替《か》える", "s": 2}, {"t": "ナビで別《べつ》ルートを検索《けんさく》し、指示《しじ》どおりに進《すす》む", "s": 1}, {"t": "車高《しゃこう》が高《たか》いので大丈夫《だいじょうぶ》と判断《はんだん》して進入《しんにゅう》する", "s": 0}], "sit": "予定《よてい》どおり進《すす》むと<b>警戒《けいかい》レベル3</b>が発令《はつれい》。ナビのルート上《うえ》のアンダーパスが冠水《かんすい》し、前《まえ》の車《くるま》が次々《つぎつぎ》に引《ひ》き返《かえ》しています。", "q": "どうする？", "tip": "ナビは冠水箇所《かんすいかしょ》を把握《はあく》していないことがあります。低《ひく》い道《みち》やアンダーパスを避《さ》け、高《たか》い道《みち》を自分《じぶん》で選《えら》びましょう。"}, "2b": {"scene": {"type": "car", "rain": 3, "depth": 15, "alert": "l3", "extra": []}, "c": [{"t": "すぐに川《かわ》から離《はな》れる方向《ほうこう》へ引《ひ》き返《かえ》し、高《たか》い場所《ばしょ》を目指《めざ》す", "s": 2}, {"t": "ハザードランプをつけ、ゆっくり進《すす》んで抜《ぬ》け道《みち》を通過《つうか》する", "s": 1}, {"t": "水《みず》に勢《いきお》いがつく前《まえ》に、スピードを上《あ》げて一気《いっき》に抜《ぬ》ける", "s": 0}], "sit": "川沿《かわぞ》いの抜《ぬ》け道《みち》に入《はい》ると、路面《ろめん》が冠水《かんすい》し始《はじ》め<b>水深《すいしん》約《やく》15cm</b>。川《かわ》の水位《すいい》も上《あ》がり、<b>警戒《けいかい》レベル3</b>が発令《はつれい》されました。", "q": "どうする？", "tip": "川沿《かわぞ》いの道《みち》は、増水《ぞうすい》や護岸《ごがん》の崩壊《ほうかい》で一気《いっき》に危険《きけん》になります。速度《そくど》を上《あ》げると水《みず》しぶきをエンジンが吸《す》い込《こ》み、停止《ていし》する原因《げんいん》にもなります。"}, "3g": {"scene": {"type": "car", "rain": 4, "depth": 15, "alert": "l4", "extra": []}, "c": [{"t": "冠水《かんすい》していない高《たか》い場所《ばしょ》に車《くるま》を止《と》め、車《くるま》を置《お》いて近《ちか》くの頑丈《がんじょう》な建物《たてもの》へ避難《ひなん》する", "s": 2}, {"t": "水《みず》が浅《あさ》いうちに、ゆっくり一定《いってい》の速《はや》さで走《はし》って冠水区間《かんすいくかん》を抜《ぬ》ける", "s": 1}, {"t": "車《くるま》の中《なか》なら雨《あめ》にぬれず安全《あんぜん》なので、その場《ば》に停車《ていしゃ》して雨《あめ》が弱《よわ》まるのを待《ま》つ", "s": 0}], "sit": "<b>警戒《けいかい》レベル4（避難指示《ひなんしじ》）</b>発令《はつれい》。迂回路《うかいろ》の一部《いちぶ》 xtra": ["stall"]}, "c": [{"t": "すぐにドアを開《あ》けて車《くるま》を降《お》り、流《なが》れに注意《ちゅうい》しながら高《たか》い場所《ばしょ》へ移動《いどう》する", "s": 2}, {"t": "窓《まど》を少《すこ》し開《あ》けて脱出口《だっしゅつぐち》を確保《かくほ》し、119番《ばん》に通報《つうほう》して車内《しゃない》で救助《きゅうじょ》を待《ま》つ", "s": 1}, {"t": "レッカー代《だい》がかかるので、エンジンをかけ直《なお》して自力《じりき》で抜《ぬ》け出《だ》そうとする", "s": 0}], "sit": "水《みず》が車《くるま》の<b>床下《ゆかした》近《ちか》く</b>まで来《き》て、<b>エンジンが止《と》まって</b>しまいました。", "q": "どうする？", "tip": "水位《すいい》が上《あ》がると、水圧《すいあつ》でドアが開《あ》かなくなります。開《あ》くうちにすぐ脱出《だっしゅつ》を。エンジンの再始動《さいしどう》は故障《こしょう》や車両火災《しゃりょうかさい》の原因《げんいん》になります。"}, "4b": {"scene": {"type": "car", "rain": 4, "depth": 60, "alert": "l4", "extra": ["stall"]}, "c": [{"t": "脱出用《だっしゅつよう》ハンマーで側面《そくめん》の窓《まど》ガラスを割《わ》り、すぐに車外《しゃがい》へ脱出《だっしゅつ》する", "s": 2}, {"t": "割《わ》る道具《どうぐ》がないので、車内《しゃない》の水位《すいい》が外《そと》と同《おな》じくらいになってからドアを押《お》し開《あ》ける", "s": 1}, {"t": "フロントガラスをたたいて割《わ》り、前《まえ》から脱出《だっしゅつ》しようとする", "s": 0}], "sit": "車内《しゃない》にとどまるうちに、水《みず》が窓《まど》の下《した》まで上昇《じょうしょう》。ドアが水圧《すいあつ》で開《あ》きません。", "q": "どうする？", "tip": "フロントガラスは割《わ》れにくい合《あ》わせガラス。側面《そくめん》の窓《まど》を割《わ》るのが基本《きほん》です。道具《どうぐ》がない場合《ばあい》は、車内外《しゃないがい》の水位差《すいいさ》が小《ちい》さくなるとドアが開《あ》きやすくなります。"}, "5g": {"scene": {"type": "car", "rain": 0, "depth": 5, "alert": "stop", "extra": []}, "c": [{"t": "持《も》ち主《ぬし》に「エンジンをかけず、販売店《はんばいてん》や保険会社《ほけんがいしゃ》に連絡《れんらく》を」と伝《つた》える", "s": 2}, {"t": "乾《かわ》けば動《うご》くはずと考《かんが》え、そのままにしておく", "s": 1}, {"t": "移動《いどう》を手伝《てつだ》うため、持《も》ち主《ぬし》にエンジンをかけるよう勧《すす》める", "s": 0}], "sit": "雨《あめ》が弱《よわ》まり、水《みず》が引《ひ》きました。高《たか》い場所《ばしょ》に置《お》いた車《くるま》は無事《ぶじ》でしたが、周《まわ》りの車《くるま》は冠水《かんすい》しています。", "q": "冠水《かんすい》した車《くるま》を見《み》かけたら？", "tip": "冠水《かんすい》した車《くるま》は、エンジンをかけたり電気《でんき》を通《とお》したりすると、故障《こしょう》や車両火災《しゃりょうかさい》につながるおそれがあります。自分《じぶん》で動《うご》かさず、専門家《せんもんか》に任《まか》せましょう。"}, "5m": {"scene": {"type": "car", "rain": 0, "depth": 5, "alert": "stop", "extra": []}, "c": [{"t": "被害《ひがい》の写真《しゃしん》を撮《と》り、エンジンをかけずに保険会社《ほけんがいしゃ》とロードサービスに連絡《れんらく》する", "s": 2}, {"t": "車内《しゃない》の荷物《にもつ》だけ先《さき》に取《と》り出《だ》し、車《くるま》は後日《ごじつ》考《かんが》える", "s": 1}, {"t": "動《うご》くか確《たし》かめるため、エンジンをかけてみる", "s": 0}], "sit": "無事《ぶじ》に避難《ひなん》できました。翌日《よくじつ》、水《みず》が引《ひ》いた道路《どうろ》に自分《じぶん》の 、水《みず》の浅《あさ》い道《みち》を選《えら》んで歩《ある》いて帰《かえ》る", "s": 0}], "sit": "業務《ぎょうむ》を続《つづ》けるうちに<b>警戒《けいかい》レベル4</b>が発令《はつれい》。電車《でんしゃ》は運転見合《うんてんみあ》わせ、職場《しょくば》の周《まわ》りは<b>水深《すいしん》約《やく》15cm</b>です。", "q": "どうする？", "tip": "一斉《いっせい》に帰宅《きたく》すると、混乱《こんらん》や二次災害《にじさいがい》を招《まね》きます。安全《あんぜん》な職場《しょくば》にとどまるのも立派《りっぱ》な避難行動《ひなんこうどう》です。"}, "3b": {"scene": {"type": "office", "rain": 4, "depth": 15, "alert": "l4", "extra": []}, "c": [{"t": "車《くるま》はあきらめ、職場《しょくば》の上《うえ》の階《かい》に避難《ひなん》する", "s": 2}, {"t": "1階《かい》のロビーで、水《みず》の様子《ようす》を見《み》ながら待機《たいき》する", "s": 1}, {"t": "車《くるま》を守《まも》るため、地下駐車場《ちかちゅうしゃじょう》から車《くるま》を出《だ》しに行《い》く", "s": 0}], "sit": "会社《かいしゃ》に引《ひ》き返《かえ》しました。<b>警戒《けいかい》レベル4</b>が発令《はつれい》され、職場《しょくば》の周《まわ》りも冠水《かんすい》し始《はじ》めています。地下駐車場《ちかちゅうしゃじょう》には自分《じぶん》の車《くるま》があります。", "q": "どうする？", "tip": "地下駐車場《ちかちゅうしゃじょう》は短時間《たんじかん》で水没《すいぼつ》し、閉《と》じ込《こ》められる危険《きけん》があります。車《くるま》より命《いのち》を優先《ゆうせん》しましょう。"}, "4g": {"scene": {"type": "office", "rain": 4, "depth": 40, "alert": "l4", "extra": []}, "c": [{"t": "1階《かい》にいる人《ひと》に声《こえ》をかけ、全員《ぜんいん》で上《うえ》の階《かい》へ避難《ひなん》する", "s": 2}, {"t": "浸水《しんすい》を食《く》い止《と》めるため、1階《かい》の入口《いりぐち》に土《ど》のうを積《つ》む作業《さぎょう》を続《つづ》ける", "s": 1}, {"t": "水《みず》が入《はい》る前《まえ》に、地下倉庫《ちかそうこ》の重要書類《じゅうようしょるい》を急《いそ》いで取《と》りに行《い》く", "s": 0}], "sit": "水深《すいしん》が<b>約《やく》40cm</b>になり、<b>1階《かい》に浸水《しんすい》</b>が始《はじ》まりました。地下《ちか》には大事《だいじ》な書類《しょるい》を保管《ほかん》する倉庫《そうこ》があります。", "q": "どうする？", "tip": "地下《ちか》は水《みず》が一気《いっき》に流《なが》れ込《こ》み、水圧《すいあつ》でドアが開《あ》かなくなって閉《と》じ込《こ》められる危険《きけん》があります。物《もの》より命《いのち》を優先《ゆうせん》し、全員《ぜんいん》で上《うえ》の階《かい》へ。"}, "4m": {"scene": {"type": "office", "rain": 4, "depth": 40, "alert": "l4", "extra": []}, "c": [{"t": "階段《かいだん》で上《うえ》の階《かい》へ移動《いどう》し、懐中電灯《かいちゅうでんとう》や飲《の》み水《みず》を確保《かくほ》する", "s": 2}, {"t": "1階《かい》で、電気《でんき》が復旧《ふっきゅう》するのを待《ま》つ", "s": 1}, {"t": "非常用電源《ひじょうようでんげん》で動《うご》いたエレベーターに乗《の》り込《こ》み、上《うえ》の階《かい》へ向《む》かう", "s": 0}], "sit": "職場《しょくば》にとどまっていると、1階《かい》に浸水《しんすい》が始《はじ》まり停電《ていでん》しました。", "q": "どうする？", "tip": "浸水《しんすい》・停電時《ていでんじ》のエレベーターは閉《と》じ込《こ》めの危険《きけん》があります。移動《いどう》は階段《かいだん》で。"}, "4b": {"scene": {"type": "office", "rain": 4, "depth": 50, "alert": "l4", "extra": []}, "c": [{"t": "大《おお》きな声《こえ》で周《まわ》りに呼《よ》びかけ、壁伝《かべづた》いに階段《かいだん》へ向《む》かい、全員《ぜんいん》で上《うえ》の階《かい》へ避難《ひなん》する", "s": 2}, {"t": "受付《うけつけ》カウンターの上《うえ》に乗《の》り、水《みず》が引《ひ》くのを待《ま》つ", "s": 1}, {"t": "出口《でぐち》から外《そと》へ出《で》て、別《べつ》の建物《たてもの》を目指《めざ》す", "s": 0}], "sit": "1階《かい》ロビーで待《ま》つうちに、水《みず》が一気《いっき》に流《なが》れ込《こ》み腰《こし》の高《たか》さに。周《まわ》りの人《ひと》がパニックになっています。", "q": "どうする？", "tip": "屋内《おくない》でも浸水《しんすい》は急激《きゅうげき》に進《すす》みます。周《まわ》りと声《こえ》をかけ合《あ》い、確実《かくじつ》に上《うえ》の階《かい》へ。外《そと》へ出《で》るのは最《もっと》も危険《きけん》です。"}, "5g": {"scene": {"type": "office", "rain": 0, "depth": 5, "alert": "stop", "extra": ["phone"]}, "c": [{"t": "災害用《さいがいよう》伝言《でんごん》ダイヤル（171）やSNSで、家族《かぞく》の安否《あんぴ》を確認《かくにん》したり伝言《でんごん》を残《のこ》したりする", "s": 2}, {"t": "家族《かぞく》の勤務先《きんむさき》や学校《がっこう》に電話《でんわ》をかけて、居場所《いばしょ》を問《と》い合《あ》わせる", "s": 1}, {"t": "雨《あめ》が弱《よわ》まったので、今《いま》のうちに歩《ある》いて家《いえ》へ向《む》かう", "s": 0}], "sit": "雨《あめ》が弱《よわ》まりました。家族《かぞく》と電話《でんわ》がつながりません。", "q": "どうする？", "tip": "災害時《さいがいじ》は電話《でんわ》がつながりにくくなります。災害用《さいがいよう》伝言《でんごん》ダイヤル（171）やSNSを使《つか》いましょう。雨《あめ》が弱《よわ》まっても、道路《どうろ》はまだ冠水《かんすい》していることがあります。"}, "5m": {"scene": {"type": "office", "rain": 0, "depth": 5, "alert": "stop", "extra": []}, "c": [{"t": "自治体《じちたい》や鉄道会社《てつどうがいしゃ》の情報《じょうほう》で帰宅《きたく》ルートの安全《あんぜん》を確認《かくにん》し、時間《じかん》をずらして帰《かえ》る", "s": 2}, {"t": "すぐに駅《えき》へ向《む》かい、最初《さいしょ》の電車《でんしゃ》で帰《かえ》る", "s": 1}, {"t": "電車《でんしゃ》が混《こ》んでいるので、冠水《かんすい》が残《のこ》る道《みち》を歩《ある》いて帰《かえ》る", "s": 0}], "sit": "一夜《いちや》明《あ》け、電車《でんしゃ》は一部《いちぶ》で運転《うんてん》を再開《さいかい》しました。会社《かいしゃ》からは「安全《あんぜん》を確認《かくにん》して帰宅《きたく》を」と連絡《れんらく》がありました。", "q": "どうする？", "tip": "災害直後《さいがいちょくご》は駅《えき》に人《ひと》が殺到《さっとう》します。ルートの安全《あんぜん》を確認《かくにん》し、時差帰宅《じさきたく》を心《こころ》がけましょう。"}, "5b": {"scene": {"type": "office", "rain": 0, "depth": 5, "alert": "stop", "extra": ["phone"]}, "c": [{"t": "171やSNSで短《みじか》く安否《あんぴ》を伝《つた》え、画面《がめん》を暗《くら》くするなどして電池《でんち》を節約《せつやく》する", "s": 2}, {"t": "家族《かぞく》に電話《でんわ》をかけ続《つづ》ける", "s": 1}, {"t": "充電《じゅうでん》のため、まだ浸水《しんすい》している1階《かい》のコンセントを探《さが》しに行《い》く", "s": 0}], "sit": "上《うえ》の階《かい》に避難《ひなん》して一夜《いちや》を明《あ》かしました。スマホの充電《じゅうでん》は残《のこ》り10%。家族《かぞく》と連絡《れんらく》が取《と》れていません。", "q": "どうする？", "tip": "電池《でんち》は命綱《いのちづな》です。短《みじか》い連絡《れんらく》で安否《あんぴ》を伝《つた》え、節電《せつでん》を。浸水《しんすい》した場所《ばしょ》の電源《でんげん》は感電《かんでん》の危険《きけん》があります。"}}}, {"id": "train", "icon": "🚃", "title": "電車《でんしゃ》に乗《の》っているとき", "desc": "通勤電車《つうきんでんしゃ》で帰宅中《きたくちゅう》", "nodes": {"1": {"scene": {"type": "train", "rain": 2, "depth": 0, "alert": "warn", "extra": []}, "c": [{"t": "運行情報《うんこうじょうほう》と、最寄《もよ》り駅《えき》周辺《しゅうへん》の浸水想定《しんすいそうてい》を確認《かくにん》し、途中《とちゅう》の駅《えき》で降《お》りるか判断《はんだん》する", "s": 2}, {"t": "とりあえず乗《の》り続《つづ》け、駅《えき》に着《つ》いてから考《かんが》える", "s": 1}, {"t": "降《お》りる駅《えき》が混《こ》む前《まえ》に、次《つぎ》の駅《えき》で降《お》りて歩《ある》いて帰《かえ》る", "s": 0}], "sit": "帰宅《きたく》の電車《でんしゃ》に乗《の》っていると、スマホに小金井市《こがねいし》の<b>大雨警報《おおあめけいほう》</b>が届《とど》きました。帰宅時間《きたくじかん》と雨《あめ》のピークが重《かさ》なる予報《よほう》です。", "q": "どうする？", "tip": "早《はや》い段階《だんかい》での情報収集《じょうほうしゅうしゅう》が、帰宅《きたく》か待機《たいき》かの判断《はんだん》を左右《さゆう》します。大雨《おおあめ》の中《なか》を長《なが》い距離《きょり》歩《ある》くのは危険《きけん》です。"}, "2g": {"scene": {"type": "train", "rain": 3, "depth": 0, "alert": "l3", "extra": ["platform"]}, "c": [{"t": "駅《えき》や自治体《じちたい》が案内《あんない》する一時滞在施設《いちじたいざいしせつ》を確認《かくにん》し、そこへ移動《いどう》する", "s": 2}, {"t": "駅《えき》の構内《こうない》で、運転再開《うんてんさいかい》を待《ま》つ", "s": 1}, {"t": "タクシー乗《の》り場《ば》の長《なが》い列《れつ》に並《なら》び、雨《あめ》の中《なか》で待《ま》ち続《つづ》ける", "s": 0}], "sit": "途中《とちゅう》の駅《えき》で降《お》りることにしました。<b>警戒《けいかい》レベル3</b>が発令《はつれい》。電車《でんしゃ》は運転見合《うんてんみあ》わせとなり、駅《えき》は帰宅困難者《きたくこんなんしゃ》であふれています。", "q": "どうする？", "tip": "帰宅困難時《きたくこんなんじ》は、むやみに移動《いどう》せず一時滞在施設《いちじたいざいしせつ》などで安全《あんぜん》を確保《かくほ》しましょう。混雑《こんざつ》した駅構内《えきこうない》は、それ自体《じたい》が危険《きけん》な場合《ばあい》があります。"}, "2m": {"scene": {"type": "train", "rain": 3, "depth": 0, "alert": "l3", "extra": []}, "c": [{"t": "乗務員《じょうむいん》の指示《しじ》を待《ま》ち、車内《しゃない》で落《お》ち着《つ》いて待機《たいき》する", "s": 2}, {"t": "状況《じょうきょう》が知《し》りたいので、乗務員室《じょうむいんしつ》の近《ちか》くまで行《い》って何度《なんど》も問《と》い合《あ》わせる", "s": 1}, {"t": "非常用《ひじょうよう》ドアコックを操作《そうさ》して線路《せんろ》に降《お》り、歩《ある》いて駅《えき》へ向《む》かう", "s": 0}], "sit": "乗《の》り続《つづ》けていると<b>警戒《けいかい》レベル3</b>が発令《はつれい》。電車《でんしゃ》が駅《えき》と駅《えき》の間《あいだ》で止《と》まり、「倒木《とうぼく》のため運転《うんてん》を見合《みあ》わせます」と放送《ほうそう》が入《はい》りました。", "q": "どうする？", "tip": "勝手《かって》に線路《せんろ》へ降《お》りると、対向列車《たいこうれっしゃ》 pth": 40, "alert": "dam", "extra": ["swimmer"]}, "c": [{"t": "あお向《む》けに浮《う》いて足《あし》を下流《かりゅう》に向《む》け、流《なが》れに身《み》を任《まか》せながら岸《きし》に近《ちか》づく機会《きかい》を待《ま》つ", "s": 2}, {"t": "近《ちか》くを流《なが》れてくる流木《りゅうぼく》にしがみつく", "s": 1}, {"t": "足《あし》をついて立《た》ち上《あ》がり、川底《かわぞこ》を歩《ある》いて岸《きし》へ向《む》かう", "s": 0}], "sit": "岸《きし》を目指《めざ》しますが流《なが》れが速《はや》く、体《からだ》が下流《かりゅう》へ押《お》し流《なが》されています。<b>ダム放流《ほうりゅう》のサイレン</b>も聞《き》こえます。", "q": "どうする？", "tip": "急流《きゅうりゅう》で立《た》とうとすると、川底《かわぞこ》の岩《いわ》に足《あし》が挟《はさ》まり溺《おぼ》れる危険《きけん》があります。あお向《む》けで足《あし》を下流《かりゅう》に向《む》けて浮《う》き、身《み》を守《まも》りましょう。"}, "4g": {"scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": []}, "c": [{"t": "119番《ばん》と連絡《れんらく》を続《つづ》け、救助隊《きゅうじょたい》に正確《せいかく》な位置《いち》と人数《にんずう》を伝《つた》えられるよう、安全《あんぜん》な場所《ばしょ》で見守《みまも》る", "s": 2}, {"t": "岸《きし》からロープを投《な》げ、中州《なかす》の人《ひと》を引《ひ》き寄《よ》せようとする", "s": 1}, {"t": "泳《およ》いで中州《なかす》へ渡《わた》り、救助《きゅうじょ》に向《む》かう", "s": 0}], "sit": "救助隊《きゅうじょたい》がこちらに向《む》かっています。河原《かわら》に残《のこ》ったグループは、増水《ぞうすい》した川《かわ》の中州《なかす》に取《と》り残《のこ》され、手《て》を振《ふ》っています。", "q": "どうする？", "tip": "急流越《きゅうりゅうご》しに人《ひと》を引《ひ》き寄《よ》せるのは極《きわ》めて危険《きけん》。素人《しろうと》の救助《きゅうじょ》は二次災害《にじさいがい》のもとです。プロに正確《せいかく》な情報《じょうほう》を伝《つた》えることが最大《さいだい》の貢献《こうけん》です。"}, "4m": {"scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": []}, "c": [{"t": "ぬれた水着《みずぎ》を脱《ぬ》がせて乾《かわ》いた服《ふく》やタオルで包《つつ》み、風《かぜ》の当《あ》たらない場所《ばしょ》で温《あたた》める", "s": 2}, {"t": "体《からだ》を温《あたた》めるため、その場《ば》で運動《うんどう》をさせる", "s": 1}, {"t": "体《からだ》を温《あたた》めるため、お酒《さけ》を飲《の》ませる", "s": 0}], "sit": "河原《かわら》はすでに濁流《だくりゅう》にのまれています。仲間《なかま》の一人《ひとり》が体《からだ》を震《ふる》わせ、唇《くちびる》が紫色《むらさきいろ》になっています。", "q": "どうする？", "tip": "低体温症《ていたいおんしょう》の疑《うたが》いがあるときは、ぬれた衣服《いふく》を脱《ぬ》がせ、乾《かわ》いた物《もの》で保温《ほおん》を。激《はげ》しい運動《うんどう》や飲酒《いんしゅ》は逆効果《ぎゃくこうか》です。"}, "4b": {"scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": ["swimmer"]}, "c": [{"t": "枝《えだ》にしっかりつかまり、大声《おおごえ》や笛《ふえ》で助《たす》けを呼《よ》んで体力《たいりょく》を温存《おんぞん》する", "s": 2}, {"t": "岸《きし》に上《あ》がろうと、枝《えだ》を伝《つた》って何度《なんど》もよじ登《のぼ》ろうとする", "s": 1}, {"t": "力《ちから》が残《のこ》っているうちに手《て》を離《はな》し、泳《およ》いで岸《きし》を目指《めざ》す", "s": 0}], "sit": "流《なが》されながらも、岸《きし》近《ちか》くの木《き》の枝《えだ》につかまることができました。体《からだ》は冷《ひ》え切《き》り、腕《うで》の力《ちから》が抜《ぬ》けてきています。", "q": "どうする？", "tip": "体力《たいりょく》が尽《つ》きると自力《じりき》での脱出《だっしゅつ》は困難《こんなん》です。無理《むり》に動《うご》かず、つかまったまま大声《おおごえ》で助《たす》けを求《もと》めることも選択肢《せんたくし》です。"}, "5g": {"scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "c": [{"t": "当日《とうじつ》は川《かわ》に近《ちか》づかず、水位《すいい》が平常《へいじょう》に戻《もど》っても数日《すうじつ》は遊泳《ゆうえい》を控《ひか》える", "s": 2}, {"t": "水位《すいい》が下《さ》がったので、河原《かわら》に残《のこ》した荷物《にもつ》だけ回収《かいしゅう》しに行《い》く", "s": 1}, {"t": "晴《は》れてきたので、泳《およ》ぎを再開《さいかい》する", "s": 0}], "sit": "救助隊《きゅうじょたい》によって全員《ぜんいん》が救出《きゅうしゅつ》されました。雨《あめ》は弱《よわ》まり、川《かわ》の水位《すいい》も下《さ》がり始《はじ》めています。", "q": "どうする？", "tip": "上流《じょうりゅう》の雨《あめ》がやんでも、しばらくは増水《ぞうすい》や濁流《だくりゅう》が続《つづ》き、ダム放流《ほうりゅう》が続《つづ》く場合《ばあい》もあります。当日《とうじつ》に再《ふたた》び川《かわ》へ入《はい》るのは厳禁《げんきん》です。"}, "5m": {"scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "c": [{"t": "すぐに119番《ばん》に通報《つうほう》し、保温《ほおん》を続《つづ》けながら救急隊《きゅうきゅうたい》を待《ま》つ", "s": 2}, {"t": "落《お》ち着《つ》くまで、車《くるま》の中《なか》で休《やす》ませる", "s": 1}, {"t": "回復《かいふく》したと判断《はんだん》し、自分《じぶん》で車《くるま》を運転《うんてん》して帰《かえ》らせる", "s": 0}], "sit": "仲間《なかま》の体温《たいおん》は少《すこ》しずつ戻《もど》ってきましたが、ぼんやりして受《う》け答《こた》えがはっきりしません。", "q": "どうする？", "tip": "意識《いしき》がはっきりしないのは、中等度《ちゅうとうど》以上《いじょう》の低体温症《ていたいおんしょう》の可能性《かのうせい》。医療機関《いりょうきかん》での処置《しょち》が必要《ひつよう》です。"}, "5b": {"scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "c": [{"t": "念《ねん》のため救急車《きゅうきゅうしゃ》で病院《びょういん》へ行《い》き、医師《いし》の診察《しんさつ》を受《う》ける", "s": 2}, {"t": "今《いま》は元気《げんき》なので、帰宅《きたく》して様子《ようす》を見《み》る", "s": 1}, {"t": "迷惑《めいわく》をかけたくないので、救急搬送《きゅうきゅうはんそう》を断《ことわ》ってその場《ば》で解散《かいさん》する", "s": 0}], "sit": "救助隊《きゅうじょたい》に引《ひ》き上《あ》げられました。水《みず》を少《すこ》し飲《の》んでしまいましたが、今《いま》は普通《ふつう》に話《はな》せます。", "q": "どうする？", "tip": "溺《おぼ》れかけた後《あと》は、数時間《すうじかん》たってから呼吸《こきゅう》の状態《じょうたい》が悪化《あっか》することがあります。元気《げんき》に見《み》えても必《かなら》ず受診《じゅしん》を。"}}}, {"id": "mountain", "icon": "⛰️", "title": "山《やま》を登《のぼ》っているとき", "desc": "梅雨《つゆ》の時期《じき》、沢沿《さわぞ》いのルートで登山中《とざんちゅう》", "nodes": {"1": {"scene": {"type": "mountain", "rain": 1, "depth": 5, "alert": "warn", "extra": ["stream"]}, "c": [{"t": "登山《とざん》を中止《ちゅうし》して、来《き》た道《みち》を引《ひ》き返《かえ》す。沢《さわ》を渡《わた》る場所《ばしょ》の増水《ぞうすい》も想定《そうてい》し、早《はや》めに下《くだ》る", "s": 2}, {"t": "ペースを上《あ》げて山頂《さんちょう》まで行《い》き、反対側《はんたいがわ》のルートで早《はや》めに下山《げざん》する", "s": 1}, {"t": "雨具《あまぐ》を着《き》て、予定《よてい》どおり山頂《さんちょう》を目指《めざ》す", "s": 0}], "sit": "梅雨《つゆ》の時期《じき》の登山《とざん》。朝《あさ》は小雨《こさめ》でしたが、昼前《ひるまえ》に<b>大雨警報《おおあめけいほう》</b>と「土砂災害警戒情報《どしゃさいがいけいかいじょうほう》が出《で》る可能性《かのうせい》」の通知《つうち》が届《とど》きました。山頂《さんちょう》まではあと2時間《じかん》です。", "q": "どうする？", "tip": "山《やま》での撤退判断《てったいはんだん》は早《はや》いほど安全《あんぜん》です。大雨時《おおあめじ》は沢《さわ》の増水《ぞうすい》や土砂《どしゃ》崩《くず》れで、帰《かえ》り道《みち》が断《た》たれることがあります。"}, "2g": {"scene": {"type": "mountain", "rain": 3, "depth": 20, "alert": "l3", "extra": ["stream"]}, "c": [{"t": "渡《わた》らずに沢《さわ》から離《はな》れた尾根《おね》など安全《あんぜん》な場所《ばしょ》へ移動《いどう》し、水《みず》が引《ひ》くのを待《ま》つ。救助要請《きゅうじょようせい》も検討《けんとう》する", "s": 2}, {"t": "ロープで体《からだ》を確保《かくほ》し、仲間《なかま》と腕《うで》を組《く》んで慎重《しんちょう》に渡《わた》る", "s": 1}, {"t": "ひざ下《した》なら大丈夫《だいじょうぶ》と判断《はんだん》し、一気《いっき》に渡《わた》る", "s": 0}], "sit": "引《ひ》き返《かえ》す途中《とちゅう》、来《く》るときに渡《わた》った沢《さわ》が増水《ぞうすい》。水《みず》は濁《にご》り、ひざ下《した》ほどの深《ふか》さで流《なが》れも速《はや》くなっています。<b>警戒《けいかい》レベル3</b>が発令《はつれい》されました。", "q": "どうする？", "tip": "増水《ぞうすい》した沢《さわ》を渡《わた》るのは、ひざ下《した》でも足《あし》をすくわれる危険大《きけんだい》。水《みず》は数時間《すうじかん》で引《ひ》くことが多《おお》く、待《ま》つ勇気《ゆうき》が命《いのち》を守《まも》ります。"}, "2m": {"scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["rockfall"]}, "c": [{"t": "すぐにその斜面《しゃめん》から離《はな》れ、崩《くず》れそうな斜面《しゃめん》と沢《さわ》から距離《きょり》を取《と》れる尾根《おね》の方向《ほうこう》へ移動《いどう》する", "s": 2}, {"t": "ヘルメットをかぶって、その斜面《しゃめん》の下《した》を急《いそ》いで通過《つうか》する", "s": 1}, {"t": "雨宿《あまやど》りのため、斜面《しゃめん》の下《した》の岩陰《いわかげ》で休《やす》む", "s": 0}], "sit": "山頂《さんちょう》を越《こ》えて下《くだ》り始《はじ》めると<b>警戒《けいかい》レベル3</b>が発令《はつれい》。登山道《とざんどう》に小石《こいし》がパラパラと落《お》ち、斜面《しゃめん》から濁《にご》った水《みず》が噴《ふ》き出《だ》しています。", "q": "どうする？", "tip": "小石《こいし》の落下《らっか》や斜面《しゃめん》からの湧《わ》き水《みず》は、土砂《どしゃ》崩《くず》れの前兆《ぜんちょう》です。斜面《しゃめん》の真下《ました》は最《もっと》も危険《きけん》。すぐに離《はな》れましょう。"}, "2b": {"scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["fog"]}, "c": [{"t": "無理《むり》に動《うご》かず、安全《あんぜん》な場所《ばしょ》でツェルト等《とう》を使《つか》って風雨《ふうう》をしのぎ、電波《でんぱ》の入《はい》る場所《ばしょ》で救助《きゅうじょ》を要請《ようせい》する", "s": 2}, {"t": "仲間《なかま》を支《ささ》えながら、来《き》た道《みち》をゆっくり下山《げざん》する", "s": 1}, {"t": "近道《ちかみち》に見《み》える沢沿《さわぞ》いの道《みち》を下《くだ》る", "s": 0}], "sit": "山頂《さんちょう》付近《ふきん》で<b>警戒《けいかい》レベル3</b>が発令《はつれい》。雨《あめ》と霧《きり》で視界《しかい》は10m、電波《でんぱ》も入《はい》りません。仲間《なかま》の一人《ひとり》が足《あし》を滑《すべ》らせ、足首《あしくび》をひねりました。", "q": "どうする？", "tip": "視界不良《しかいふりょう》でけが人《ひと》がいる中《なか》での行動《こうどう》は遭難《そうなん》を招《まね》きます。沢沿《さわぞ》いは増水《ぞうすい》の危険大《きけんだい》。緊急《きんきゅう》の露営《ろえい》（ビバーク）と早《はや》めの救助要請《きゅうじょようせい》を。"}, "3g": {"scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}, "c": [{"t": "土石流《どせきりゅう》の前兆《ぜんちょう》と判断《はんだん》し、沢《さわ》からさらに離《はな》れた高《たか》い場所《ばしょ》へ直《ただ》ちに移動《いどう》する", "s": 2}, {"t": "その場《ば》で身《み》を低《ひく》くして、様子《ようす》を見《み》る", "s": 1}, {"t": "水位《すいい》が下《さ》がった今《いま》のうちに、沢《さわ》を渡《わた》って下山《げざん》する", "s": 0}], "sit": "尾根《おね》で待機中《たいきちゅう》、<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》されました。上流《じょうりゅう》から「ゴロゴロ」という音《おと》とともに、沢《さわ》の水位《すいい》が急《きゅう》に下《さ》がりました。", "q": "どうする？", "tip": "雨《あめ》が続《つづ》くのに沢《さわ》の水位《すいい》が急《きゅう》に下《さ》がるのは、上流《じょうりゅう》で土砂《どしゃ》が水《みず》をせき止《と》めている可能性《かのうせい》。土石流《どせきりゅう》の直前《ちょくぜん》の危険《きけん》なサインです。"}, "3m": {"scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["rockfall"]}, "c": [{"t": "崩《くず》れた場所《ばしょ》は通《とお》らず、安全《あんぜん》な場所《ばしょ》で待機《たいき》して救助《きゅうじょ》を要請《ようせい》する", "s": 2}, {"t": "崩《くず》れた土砂《どしゃ》の上《うえ》を、足早《あしばや》に渡《わた》り切《き》る", "s": 1}, {"t": "崩《くず》れた場所《ばしょ》を避《さ》けるため、道《みち》のない斜面《しゃめん》を下《くだ》る", "s": 0}], "sit": "斜面《しゃめん》から離《はな》れた直後《ちょくご》、<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》されました。下山《げざん》ルートの途中《とちゅう》には、土砂《どしゃ》崩《くず》れで登山道《とざんどう》が埋《う》まった場所《ばしょ》があります。", "q": "どうする？", "tip": "一度《いちど》崩《くず》れた斜面《しゃめん》は再《ふたた》び崩《くず》れやすく、土砂《どしゃ》の上《うえ》は足場《あしば》も不安定《ふあんてい》です。道《みち》のない斜面《しゃめん》を下《くだ》るのは滑落《かつらく》の危険《きけん》があります。"}, "3b": {"scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}, "c": [{"t": "沢《さわ》から離《はな》れる方向《ほうこう》へ斜面《しゃめん》を登《のぼ》り返《かえ》し、高《たか》い場所《ばしょ》で救助《きゅうじょ》を待《ま》つ", "s": 2}, {"t": "沢沿《さわぞ》いの道《みち》の端《はし》を、慎重《しんちょう》に下《くだ》り続《つづ》ける", "s": 1}, {"t": "道《みち》が水《みず》で通《とお》れないので、沢《さわ》の中《なか》を歩《ある》いて下《くだ》る", "s": 0}], "sit": "沢沿《さわぞ》いの道《みち》を下《くだ》るうちに<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》。沢《さわ》の水《みず》があふれ、登山道《とざんどう》が川《かわ》のようになっています。", "q": "どうする？", "tip": "沢沿《さわぞ》いは鉄砲水《てっぽうみず》や土石流《どせきりゅう》の通《とお》り道《みち》です。標高《ひょうこう》を上《あ》げ、沢《さわ》から離《はな》れることが鉄則《てっそく》です。"}, "4g": {"scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["phone"]}, "c": [{"t": "電波《でんぱ》が入《はい》るうちに110番《ばん》か119番《ばん》で、現在地《げんざいち》（緯度《いど》・経度《けいど》）と人数《にんずう》・装備《そうび》を伝《つた》え、その後《ご》は電源《でんげん》を切《き》って節電《せつでん》する", "s": 2}, {"t": "家族《かぞく》に電話《でんわ》して、状況《じょうきょう》を詳《くわ》しく伝《つた》える", "s": 1}, {"t": "SNSに現在地《げんざいち》の写真《しゃしん》を投稿《とうこう》して助《たす》けを求《もと》め、返信《へんしん》を待《ま》つ", "s": 0}], "sit": "高《たか》い場所《ばしょ》に移動《いどう》して夜《よる》を迎《むか》えました。スマホの電池《でんち》は残《のこ》り20%。ときどき電波《でんぱ》が入《はい》ります。", "q": "どうする？", "tip": "山岳遭難《さんがくそうなん》は110番《ばん》・119番《ばん》へ。位置情報《いちじょうほう》を正確《せいかく》に伝《つた》え、救助《きゅうじょ》までの間《あいだ》は電池《でんち》を節約《せつやく》しましょう。"}, "4m": {"scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": []}, "c": [{"t": "ツェルトや雨具《あまぐ》で風雨《ふうう》を防《ふせ》ぎ、乾《かわ》いた服《ふく》に着替《きが》え、仲間《なかま》と体《からだ》を寄《よ》せ合《あ》って体温《たいおん》を保《たも》つ", "s": 2}, {"t": "ぬれた服《ふく》のまま雨具《あまぐ》を着《き》て、朝《あさ》まで動《うご》かずに待《ま》つ", "s": 1}, {"t": "体《からだ》を温《あたた》めるため、ヘッドライトを頼《たの》りに夜間《やかん》の下山《げざん》を始《はじ》める", "s": 0}], "sit": "救助《きゅうじょ》を待《ま》って夜《よる》を迎《むか》えました。雨《あめ》と風《かぜ》が強《つよ》く、仲間《なかま》が震《ふる》えています。気温《きおん》は10℃です。", "q": "どうする？", "tip": "夏山《なつやま》でも、ぬれと風《かぜ》で低体温症《ていたいおんしょう》になります。乾《かわ》いた衣類《いるい》と風《かぜ》よけが重要《じゅうよう》です。夜間《やかん》の行動《こうどう》は道迷《みちまよ》いや滑落《かつらく》の危険《きけん》が大《おお》きくなります。"}, "4b": {"scene": {"type": "mountain", "rain": 4, "depth": 40, "alert": "dosha", "extra": ["stream", "debris"]}, "c": [{"t": "土石流《どせきりゅう》の流《なが》れに対《たい》して横方向《よこほうこう》に、少《すこ》しでも高《たか》い場所《ばしょ》へ全力《ぜんりょく》で逃《に》げる", "s": 2}, {"t": "近《ちか》くの大木《たいぼく》にしがみつく", "s": 1}, {"t": "流《なが》れと同《おな》じ下流《かりゅう》方向《ほうこう》へ、全力《ぜんりょく》で走《はし》って逃《に》げる", "s": 0}], "sit": "斜面《しゃめん》を登《のぼ》り返《かえ》そうとしたとき、上流《じょうりゅう》から轟音《ごうおん》とともに<b>土石流《どせきりゅう》</b>が迫《せま》ってきました。", "q": "どうする？", "tip": "土石流《どせきりゅう》は時速《じそく》数十《すうじゅう ", "rain": 4, "depth": 0, "alert": "l4", "extra": ["phone"]}, "c": [{"t": "想定浸水深《そうていしんすいしん》を伝《つた》えて2階《かい》も危険《きけん》な可能性《かのうせい》を説明《せつめい》し、近所《きんじょ》の人《ひと》の手《て》を借《か》りてすぐ高台《たかだい》へ避難《ひなん》するよう強《つよ》く促《うなが》す", "s": 2}, {"t": "2階《かい》のなるべく高《たか》い場所《ばしょ》にいるよう伝《つた》え、こまめに連絡《れんらく》を取《と》る", "s": 1}, {"t": "自分《じぶん》が車《くるま》で迎《むか》えに行《い》くと伝《つた》え、海沿《うみぞ》いの家《いえ》へ向《む》かう", "s": 0}], "sit": "高台《たかだい》の避難場所《ひなんばしょ》に着《つ》きました。満潮《まんちょう》の時刻《じこく》が近《ちか》づいています。海沿《うみぞ》いに住《す》む高齢《こうれい》の両親《りょうしん》と連絡《れんらく》がとれると「家《いえ》の2階《かい》にいれば大丈夫《だいじょうぶ》」と言《い》っています。", "q": "どうする？", "tip": "高潮《たかしお》は満潮《まんちょう》と重《かさ》なると被害《ひがい》が拡大《かくだい》します。想定浸水深《そうていしんすいしん》によっては2階《かい》も危険《きけん》です。迎《むか》えに向《む》かう人《ひと》の被災《ひさい》も多《おお》く発生《はっせい》しています。"}, "4m": {"scene": {"type": "car", "rain": 4, "depth": 30, "alert": "l4", "extra": []}, "c": [{"t": "すぐに車《くるま》を降《お》り、波《なみ》の来《こ》ない方向《ほうこう》の高《たか》い建物《たてもの》や高台《たかだい》へ避難《ひなん》する", "s": 2}, {"t": "エンジンをかけて、冠水《かんすい》した駐車場《ちゅうしゃじょう》から脱出《だっしゅつ》を試《ため》みる", "s": 1}, {"t": "車《くるま》が流《なが》されないよう、車内《しゃない》で踏《ふ》ん張《ば》って待《ま》つ", "s": 0}], "sit": "車内《しゃない》で待《ま》つうちに駐車場《ちゅうしゃじょう》が冠水《かんすい》。<b>水深《すいしん》約《やく》30cm</b>で、車《くるま》が少《すこ》し揺《ゆ》れ始《はじ》めました。", "q": "どうする？", "tip": "車《くるま》が揺《ゆ》れ始《はじ》めたら浮《う》き始《はじ》めている合図《あいず》。すぐに車《くるま》を離《はな》れ、高《たか》い場所《ばしょ》へ。"}, "4b": {"scene": {"type": "sea", "rain": 4, "depth": 50, "alert": "l5", "extra": ["highwave"]}, "c": [{"t": "救助隊《きゅうじょたい》の指示《しじ》に従《したが》い、姿勢《しせい》を低《ひく》くして堤防《ていぼう》の陸側《りくがわ》へ移動《いどう》し、高《たか》い建物《たてもの》へ避難《ひなん》する", "s": 2}, {"t": "波《なみ》が引《ひ》いたタイミングで、走《はし》って陸側《りくがわ》へ逃《に》げる", "s": 1}, {"t": "救助《きゅうじょ》の様子《ようす》を最後《さいご》まで見届《みとど》けるため、その場《ば》にとどまる", "s": 0}], "sit": "救助隊《きゅうじょたい》が到着《とうちゃく》し、仲間《なかま》は救助《きゅうじょ》されました。しかし波《なみ》はさらに激《はげ》しく、あなたの足元《あしもと》にも海水《かいすい》が勢《いきお》いよく流《なが》れています。<b>警戒《けいかい》レベル5（緊急安全確保《きんきゅうあんぜんかくほ》）</b>が発令《はつれい》されました。", "q": "どうする？", "tip": "波《なみ》の中《なか》を走《はし》ると転倒《てんとう》しやすく危険《きけん》です。救助隊《きゅうじょたい》の指示《しじ》が最優先《さいゆうせん》です。"}, "5g": {"scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}, "c": [{"t": "高潮《たかしお》・高波《たかなみ》の警報《けいほう》解除《かいじょ》と、海沿《うみぞ》いの道路《どうろ》の安全《あんぜん》を確認《かくにん》してから行動《こうどう》する", "s": 2}, {"t": "晴《は》れたので、両親《りょうしん》の家《いえ》の被害《ひがい》を確認《かくにん》しに海沿《うみぞ》いへ向《む》かう", "s": 1}, {"t": "台風一過《たいふういっか》で魚《さかな》がよく釣《つ》れそうなので、釣《つ》りに出《で》かける", "s": 0}], "sit": "台風《たいふう》が過《す》ぎ去《さ》り、青空《あおぞら》が広《ひろ》がりました。両親《りょうしん》は無事《ぶじ》でした。", "q": "どうする？", "tip": "台風《たいふう》が通過《つうか》した後《あと》も、吹《ふ》き返《かえ》しの風《かぜ》やうねりが残《のこ》ります。警報《けいほう》の解除《かいじょ》を確認《かくにん》してから海《うみ》に近《ちか》づきましょう。"}, "5m": {"scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}, "c": [{"t": "エンジンをかけず、ロードサービスと保険会社《ほけんがいしゃ》に連絡《れんらく》する", "s": 2}, {"t": "水道水《すいどうすい》で洗《あら》えば大丈夫《だいじょうぶ》と考《かんが》え、洗《あら》ってから乗《の》る", "s": 1}, {"t": "動《うご》くか確《たし》かめるため、エンジンをかけてみる", "s": 0}], "sit": "台風《たいふう》が過《す》ぎました。車《くるま》は海水《かいすい》につかってしまいました。", "q": "どうする？", "tip": "海水《かいすい》につかった車《くるま》は、塩分《えんぶん》で電気系統《でんきけいとう》がショートしやすく、時間《じかん》がたってから車両火災《しゃりょうかさい》が起《お》きることもあります。"}, "5b": {"scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}, "c": [{"t": "自分《じぶん》も受診《じゅしん》し、体温《たいおん》の低下《ていか》や肺《はい》に水《みず》が入《はい》っていないか診察《しんさつ》を受《う》ける", "s": 2}, {"t": "自分《じぶん》は元気《げんき》なので、家《いえ》で休《やす》む", "s": 1}, {"t": "堤防《ていぼう》に置《お》いてきた釣《つ》り道具《どうぐ》を回収《かいしゅう》しに行《い》く", "s": 0}], "sit": "台風《たいふう》が去《さ》りました。仲間《なかま》は病院《びょういん》に運《はこ》ばれました。あなたもずぶぬれで、海水《かいすい》を少《すこ》し飲《の》んでいます。", "q": "どうする？", "tip": "海水《かいすい》を飲《の》んだ後《あと》は肺炎《はいえん》などの危険《きけん》があります。救助《きゅうじょ》された後《あと》に現場《げんば》へ戻《もど》るのは厳禁《げんきん》です。"}}}, {"id": "chika", "icon": "🚇", "title": "地下街《ちかがい》にいるとき", "desc": "都心《としん》の地下街《ちかがい》で買《か》い物中《ものちゅう》", "nodes": {"1": {"scene": {"type": "underground", "rain": 2, "depth": 0, "alert": "kiroku", "extra": []}, "c": [{"t": "買《か》い物《もの》を中断《ちゅうだん》し、すぐに地上《ちじょう》の頑丈《がんじょう》なビルの上《うえ》の階《かい》へ移動《いどう》する", "s": 2}, {"t": "地下街《ちかがい》の中《なか》で、雨《あめ》が弱《よわ》まるのを待《ま》つ", "s": 1}, {"t": "地上《ちじょう》は雨《あめ》がひどいので、地下鉄《ちかてつ》で移動《いどう》して帰《かえ》る", "s": 0}], "sit": "都心《としん》の地下街《ちかがい》で買《か》い物中《ものちゅう》、スマホに<b>記録的短時間大雨情報《きろくてきたんじかんおおあめじょうほう》</b>が届《とど》きました。地上《ちじょう》では1時間《じかん》に100mm近《ちか》い雨《あめ》。地下街《ちかがい》はまだ普段《ふだん》どおりです。", "q": "どうする？", "tip": "記録的短時間大雨情報《きろくてきたんじかんおおあめじょうほう》は、浸水《しんすい》が急激《きゅうげき》に広《ひろ》がる危険《きけん》を示《しめ い》へ移動《いどう》する", "s": 1}, {"t": "エレベーターで上《うえ》の階《かい》へ移動《いどう》する", "s": 0}], "sit": "友人《ゆうじん》も地上《ちじょう》のビルに避難《ひなん》できました。<b>警戒《けいかい》レベル4</b>が発令《はつれい》。ビルの1階《かい》にも水《みず》が入《はい》り始《はじ》め、停電《ていでん》しました。", "q": "どうする？", "tip": "停電《ていでん》・浸水時《しんすいじ》のエレベーターは閉《と》じ込《こ》めの危険《きけん》があります。移動《いどう》は階段《かいだん》で。"}, "3m": {"scene": {"type": "underground", "rain": 4, "depth": 30, "alert": "l4", "extra": []}, "c": [{"t": "手《て》すりにしっかりつかまり、流《なが》れの弱《よわ》い壁側《かべがわ》を一段《いちだん》ずつ上《のぼ》る。無理《むり》なら別《べつ》の出口《でぐち》へ", "s": 2}, {"t": "勢《いきお》いをつけて、階段《かいだん》を一気《いっき》に駆《か》け上《あ》がる", "s": 1}, {"t": "流《なが》れが弱《よわ》まるまで、階段《かいだん》の下《した》で待《ま》つ", "s": 0}], "sit": "出口《でぐち》の階段《かいだん》を目指《めざ》しますが、階段《かいだん》の上《うえ》から滝《たき》のように水《みず》が流《なが》れ落《お》ちてきます。水《みず》は足首《あしくび》の上《うえ》まで来《き》ました。", "q": "どうする？", "tip": "階段《かいだん》を流《なが》れ落《お》ちる水《みず》は想像以上《そうぞういじょう》に強《つよ》く、大人《おとな》でも足《あし》をすくわれます。手《て》すりを使《つか》い、無理《むり》なら別《べつ》の出口《でぐち》を。"}, "3b": {"scene": {"type": "underground", "rain": 4, "depth": 30, "alert": "l4", "extra": []}, "c": [{"t": "別《べつ》の出口《でぐち》へ、壁《かべ》や手《て》すりを伝《つた》って移動《いどう》し、地上《ちじょう》を目指《めざ》す", "s": 2}, {"t": "周《まわ》りの人《ひと》と協力《きょうりょく》して、扉《とびら》を押《お》し開《あ》けようとし続《つづ》ける", "s": 1}, {"t": "水《みず》の少《すく》ない地下《ちか》2階《かい》へ下《お》りて、様子《ようす》を見《み》る", "s": 0}], "sit": "地下通路《ちかつうろ》を進《すす》むうちに、水《みず》がひざ下《した》まで上《あ》がりました。前方《ぜんぽう》では「出口《でぐち》の扉《とびら》が水圧《すいあつ》で開《あ》かない」と叫《さけ》ぶ声《こえ》がします。", "q": "どうする？", "tip": "水深《すいしん》数十《すうじゅう》cmでも、水圧《すいあつ》で扉《とびら》は開《あ》きにくくなります。下《した》の階《かい》は最《もっと》も早《はや》く水没《すいぼつ》します。"}, "4g": {"scene": {"type": "office", "rain": 4, "depth": 50, "alert": "l5", "extra": []}, "c": [{"t": "ビルの上《うえ》の階《かい》にとどまり、公式情報《こうしきじょうほう》を確認《かくにん》しながら水位《すいい》が下《さ》がるのを待《ま》つ", "s": 2}, {"t": "周《まわ》りの様子《ようす》を確《たし》かめるため、屋上《おくじょう》に出《で》てみる", "s": 1}, {"t": "入口《いりぐち》の近《ちか》くにいる人《ひと》を助《たす》けに、1階《かい》へ下《お》りる", "s": 0}], "sit": "上《うえ》の階《かい》で待機《たいき》していると<b>警戒《けいかい》レベル5（緊急安全確保《きんきゅうあんぜんかくほ》）</b>が発令《はつれい》。窓《まど》の外《そと》では、地下街《ちかがい》の入口《いりぐち》が完全《かんぜん》に水没《すいぼつ》しています。", "q": "どうする？", "tip": "豪雨《ごうう》の中《なか》の屋上《おくじょう》は、落雷《らくらい》や転落《てんらく》の危険《きけん》もあります。安全《あんぜん》な屋内《おくない》の上《うえ》の階《かい》で待機《たいき》を。"}, "4m": {"scene": {"type": "office", "rain": 4, "depth": 40, "alert": "l4", "extra": []}, "c": [{"t": "最《もっと》も近《ちか》い頑丈《がんじょう》なビルの上《うえ》の階《かい》に入《い》れてもらう", "s": 2}, {"t": "流《なが》れの弱《よわ》い歩道《ほどう》の端《はし》を歩《ある》き、遠《とお》くの指定避難所《していひなんじょ》を目指《めざ》す", "s": 1}, {"t": "地下鉄《ちかてつ》の別《べつ》の駅《えき》から帰《かえ》れないか、地下《ちか》へ入《はい》り直《なお》す", "s": 0}], "sit": "地上《ちじょう》に出《で》ましたが、道路《どうろ》には腰《こし》の高《たか》さまで水《みず》が流《なが》れています。周《まわ》りには高《たか》いビルがあります。", "q": "どうする？", "tip": "浸水《しんすい》した道路《どうろ》を長《なが》い距離《きょり》移動《いどう》するのは危険《きけん》。近《ちか》くの頑丈《がんじょう》な建物《たてもの》の上《うえ》の階《かい》が、緊急《きんきゅう》の避難先《ひなんさき》です。"}, "4b": {"scene": {"type": "underground", "rain": 4, "depth": 60, "alert": "l4", "extra": []}, "c": [{"t": "スマホのライトで天井《てんじょう》近《ちか》くの案内表示《あんないひょうじ》を確認《かくにん》し、壁伝《かべづた》いに出口《でぐち》へ向《む》かう", "s": 2}, {"t": "その場《ば》で浮《う》かびながら、救助《きゅうじょ》を待《ま》つ", "s": 1}, {"t": "水《みず》に潜《もぐ》って、水没《すいぼつ》した通路《つうろ》の先《さき》の出口《でぐち》を目指《めざ》す", "s": 0}], "sit": "地下《ちか》で水《みず》は胸《むね》の高《たか》さに。照明《しょうめい》が消《き》え、真《ま》っ暗《くら》になりました。", "q": "どうする？", "tip": "地下《ちか》で停電《ていでん》すると、方向《ほうこう》がわからなくなります。案内表示《あんないひょうじ》と壁《かべ》を頼《たの》りに出口《でぐち》へ。水没《すいぼつ》した通路《つうろ》に潜《もぐ》るのは極《きわ》めて危険《きけん》です。"}, "5g": {"scene": {"type": "office", "rain": 0, "depth": 20, "alert": "stop", "extra": []}, "c": [{"t": "管理者《かんりしゃ》の安全確認《あんぜんかくにん》が終《お》わるまで地下《ちか》には入《はい》らず、地上《ちじょう》のルートで帰宅《きたく》する", "s": 2}, {"t": "地下街《ちかがい》の店《みせ》に忘《わす》れた荷物《にもつ》を取《と》りに行《い》く", "s": 1}, {"t": "近道《ちかみち》の地下通路《ちかつうろ》を通《とお》って駅《えき》へ向《む》かう", "s": 0}], "sit": "雨《あめ》がやみ、水《みず》が引《ひ》き始《はじ》めました。地下街《ちかがい》には泥水《どろみず》が残《のこ》っています。", "q": "どうする？", "tip": "水《みず》が引《ひ》いた後《あと》の地下《ちか》は、酸欠《さんけつ》や有毒《ゆうどく》ガス、感電《かんでん》の危険《きけん》があることも。安全《あんぜん》が確認《かくにん》されるまで入《はい》らないこと。"}, "5m": {"scene": {"type": "office", "rain": 0, "depth": 10, "alert": "stop", "extra": []}, "c": [{"t": "傷《きず》を洗《あら》って消毒《しょうどく》し、早《はや》めに医療機関《いりょうきかん》を受診《じゅしん》する", "s": 2}, {"t": "帰宅《きたく》してからシャワーを浴《あ》びて様子《ようす》を見《み》る", "s": 1}, {"t": "汚《よご》れた手《て》で傷《きず》をこすって、汚《よご》れを落《お》とす", "s": 0}], "sit": "ビルの上《うえ》の階《かい》で一夜《いちや》を過《す》ごしました。朝《あさ》になり水《みず》は引《ひ》きましたが、体《からだ》は汚《よご》れた水《みず》でぬれ、すねに切《き》り傷《きず》があります。", "q": "どうする？", "tip": "浸水《しんすい》した水《みず》には下水《げすい》が混《こ》ざり、傷《きず》から破傷風《はしょうふう》などに感染《かんせん》するおそれがあります。早《はや》めの受診《じゅしん》を。"}, "5b": {"scene": {"type": "underground", "rain": 0, "depth": 30, "alert": "stop", "extra": []}, "c": [{"t": "救助隊《きゅうじょたい》に友人《ゆうじん》がいた場所《ばしょ》と服装《ふくそう》を伝《つた》え、捜索《そうさく》を任《まか》せる", "s": 2}, {"t": "友人《ゆうじん》のスマホに電話《でんわ》をかけ続《つづ》ける", "s": 1}, {"t": "友人《ゆうじん》を探《さが》しに、もう一度《いちど》地下《ちか》へ下《お》りる", "s": 0}], "sit": "なんとか地上《ちじょう》に出《で》て救助《きゅうじょ》されました。一緒《いっしょ》にいた友人《ゆうじん》と連絡《れんらく》がとれず、まだ地下《ちか》にいるかもしれません。", "q": "どうする？", "tip": "二次災害《にじさいがい》を防《ふせ》ぐため、捜索《そうさく》はプロに。正確《せいかく》な情報提供《じょうほうていきょう》が最大《さいだい》の助《たす》けになります。"}}}, {"id": "camp", "icon": "⛺", "title": "中州《なかす》でキャンプしているとき", "desc": "夏休《なつやす》み、川《かわ》の中州《なかす》でキャンプ中《なか》", "nodes": {"1": {"scene": {"type": "camp", "rain": 1, "depth": 0, "alert": "warn", "extra": []}, "c": [{"t": "暗《くら》くなる前《まえ》に中州《なかす》から撤収《てっしゅう》し、川《かわ》から離《はな》れた高《たか》い場所《ばしょ》へ移動《いどう》する", "s": 2}, {"t": "夕食《ゆうしょく》を終《お》えたら、テントを片付《かたづ》けて岸《きし》へ移《うつ》る", "s": 1}, {"t": "小雨《こさめ》なので、テントの中《なか》で様子《ようす》を見《み》る", "s": 0}], "sit": "夏休《なつやす》み、川《かわ》の中州《なかす》でキャンプをしています。夕方《ゆうがた》から雨《あめ》が降《ふ》り始《はじ》め、ラジオで「<b>上流《じょうりゅう》で大雨《おおあめ》、警報《けいほう》発表《はっぴょう》</b>」と聞《き》きました。このあたりはまだ小雨《こさめ》です。", "q": "どうする？", "tip": "中州《なかす》は増水《ぞうすい》すると真《ま》っ先《さき》に孤立《こりつ》・水没《すいぼつ》します。上流《じょうりゅう》の大雨《おおあめ》は、下流《かりゅう》で数時間後《すうじかんご》の増水《ぞうすい》を招《まね》きます。明《あか》るいうちに撤収《てっしゅう》を。"}, "2g": {"scene": {"type": "camp", "rain": 2, "depth": 15, "alert": "l3", "extra": ["night", "empty"]}, "c": [{"t": "安全《あんぜん》な岸《きし》の上《うえ》から大声《おおごえ》で避難《ひなん》を呼《よ》びかけ、同時《どうじ》に119番《ばん》に通報《つうほう》する", "s": 2}, {"t": "キャンプ場《ば》の管理棟《かんりとう》に伝《つた》えに行《い》き、対応《たいおう》を任《まか》せる", "s": 1}, {"t": "中州《なかす》まで渡《わた》って、テントの人《ひと》に直接《ちょくせつ》知《し》らせに行《い》く", "s": 0}], "sit": "高台《たかだい》の駐車場《ちゅうしゃじょう》に移動《いどう》しました。夜《よる》、<b>警戒《けいかい》レベル3</b>が発令《はつれい》。中州《なかす》にはまだ別《べつ》のテントが残《のこ》っていて、明《あ》かりがついています。", "q": "どうする？", "tip": "増水中《ぞうすいちゅう》の川《かわ》を渡《わた》るのは命取《いのちと》りです。安全《あんぜん》な場所《ばしょ》から呼《よ》びかけ、通報《つうほう》を。"}, "2m": {"scene": {"type": "camp", "rain": 2, "depth": 20, "alert": "dam", "extra": []}, "c": [{"t": "テントや道具《どうぐ》は置《お》いて、すぐ全員《ぜんいん》で浅《あさ》い側《がわ》から岸《きし》へ渡《わた》り、高《たか》い場所《ばしょ》へ避難《ひなん》する", "s": 2}, {"t": "テントを急《いそ》いでたたみ、荷物《にもつ》をまとめてから岸《きし》へ渡《わた》る", "s": 1}, {"t": "中州《なかす》の一番《いちばん》高《たか》い場所《ばしょ》に移動《いどう》して、水《みず》が引《ひ》くのを待《ま》つ", "s": 0}], "sit": "夕食《ゆうしょく》の片付《かたづ》けをしていると、上流《じょうりゅう》のダムから<b>放流《ほうりゅう》を知《し》らせるサイレン</b>が鳴《な》り、中州《なかす》の周《まわ》りの水位《すいい》が上《あ》がり始《はじ》めました。", "q": "どうする？", "tip": "ダム放流《ほうりゅう》のサイレンは急激《きゅうげき》な増水《ぞうすい》の合図《あいず》。持《も》ち物《もの》は捨《す》ててでも、すぐに岸《きし》へ。"}, "2b": {"scene": {"type": "camp", "rain": 2, "depth": 30, "alert": "dam", "extra": ["night"]}, "c": [{"t": "無理《むり》に渡《わた》らず、すぐに119番《ばん》に通報《つうほう》し、中州《なかす》の最《もっと》も高《たか》い場所《ばしょ》に全員《ぜんいん》で移動《いどう》して救助《きゅうじょ》を待《ま》つ", "s": 2}, {"t": "仲間《なかま》と腕《うで》を組《く》んで、浅《あさ》そうな場所《ばしょ》から岸《きし》へ渡《わた》る", "s": 1}, {"t": "車《くるま》に乗《の》って、浅《あさ》い場所《ばしょ》を突《つ》っ切《き》って岸《きし》へ向《む》かう", "s": 0}], "sit": "テントで様子《ようす》を見《み》ていると、<b>ダム放流《ほうりゅう》のサイレン</b>。中州《なかす》の周《まわ》りはすでに濁流《だくりゅう》で、岸《きし》へ渡《わた》れる場所《ばしょ》もひざ上《うえ》の深《ふか》さです。", "q": "どうする？", "tip": "濁流《だくりゅう》の中《なか》を渡《わた》るのは極《きわ》めて危険《きけん》。渡《わた》れないと判断《はんだん》したらすぐ通報《つうほう》し、救助《きゅうじょ》を待《ま》ちましょう。"}, "3g": {"scene": {"type": "camp", "rain": 3, "depth": 30, "alert": "l4", "extra": ["night"]}, "c": [{"t": "救助隊《きゅうじょたい》に正確《せいかく》な場所《ばしょ》と人数《にんずう》を伝《つた》え、岸《きし》から照《て》らして位置《いち》を示《しめ》し続《つづ》ける", "s": 2}, {"t": "ロープを投《な》げて引《ひ》き寄《よ》せられないか試《ため》す", "s": 1}, {"t": "浮《う》き輪《わ》をつけて、中州《なかす》まで泳《およ》いで向《む》かう", "s": 0}], "sit": "<b>警戒《けいかい》レベル4</b>が発令《はつれい》。真夜中《まよなか》、中州《なかす》のテントの人《ひと》たちが取《と》り残《のこ》され、懐中電灯《かいちゅうでんとう》を振《ふ》っています。", "q": "どうする？", "tip": "夜《よる》の濁流《だくりゅう》は危険《きけん》が見《み》えません。救助《きゅうじょ》はプロに任《まか》せ、情報《じょうほう》と明《あ》かりで支援《しえん》を。"}, "3m": {"scene": {"type": "camp", "rain": 3, "depth": 30, "alert": "l4", "extra": ["night", "empty"]}, "c": [{"t": "119番《ばん》に通報《つうほう》し、安全《あんぜん》な場所《ばしょ》から仲間《なかま》の名前《なまえ》を呼《よ》び続《つづ》ける", "s": 2}, {"t": "岸《きし》ぎりぎりまで行《い》き、懐中電灯《かいちゅうでんとう》で中州《なかす》を照《て》らして探《さが》す", "s": 1}, {"t": "仲間《なかま》を探《さが》しに中州《なかす》へ戻《もど》る", "s": 0}], "sit": "岸《きし》へ渡《わた》りましたが、仲間《なかま》が一人《ひとり》いません。テントに戻《もど》ったのかもしれません。<b>警戒《けいかい》レベル4</b>が発令《はつれい》されています。", "q": "どうする？", "tip": "仲間《なかま》を助《たす》けたい気持《きも》ちが二次被害《にじひがい》を招《まね》きます。通報《つうほう》と /* =========================================================
   ふりがな
   ========================================================= */
let FURI = false;
const RUBY_RE = /([\u3005\u30F6\u4E00-\u9FFF]+)《([^》]+)》/g;
function rb(s){ s=String(s); return FURI ? s.replace(RUBY_RE,'<ruby>$1<rt>$2</rt></ruby>') : s.replace(/《[^》]+》/g,''); }
function plain(s){ return String(s).replace(/《[^》]+》/g,''); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function setT(el,raw){ if(typeof el==='string') el=document.getElementById(el); el.dataset.raw=raw; el.innerHTML=rb(raw); }
function T(path){ return path.split('.').reduce((o,k)=>o[k],UI); }
function refreshText(){
  document.querySelectorAll('[data-k]').forEach(el=>el.innerHTML=rb(T(el.dataset.k)));
  document.querySelectorAll('[data-raw]').forEach(el=>el.innerHTML=rb(el.dataset.raw));
  document.querySelectorAll('.furi').forEach(b=>{b.innerHTML=FURI?UI.common.furiOn:UI.common.furiOff;b.classList.toggle('on',FURI);});
  document.getElementById('snd-btn').innerHTML=rb(AU.on?UI.common.sndOn:UI.common.sndOff);
}
function toggleFuri(){
  FURI=!FURI; refreshText();
  document.getElementById('hero').innerHTML=buildSVG(HERO);
  const qs=document.getElementById('q-scene');
  if(curScene && !qs.querySelector('video')) qs.innerHTML=buildSVG(curScene);
}

/* =========================================================
   効果音（ブラウザ内で合成）
   ========================================================= */
const AU={ctx:null,on:true,timer:null};
function audioInit(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      const ctx=AU.ctx=new C();
      const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.noise=buf; AU.master=ctx.createGain(); AU.master.connect(ctx.destination); AU.master.gain.value=AU.on?1:0;
      const mk=(type,freq,q)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.master);s.start();return g;};
      AU.rainG=mk("bandpass",2600,0.5); AU.heavyG=mk("lowpass",900,0.7); AU.waterG=mk("lowpass",320,1.2); AU.deepG=mk("lowpass",140,2.0);
    }
    if(AU.ctx.state!=="running")AU.ctx.resume();
  }catch(e){}
}
function setAmbient(rain,depth){
  if(!AU.ctx)return; const t=AU.ctx.currentTime;
  AU.rainG.gain.setTargetAtTime([0,.05,.10,.16,.24][rain],t,.6);
  AU.heavyG.gain.setTargetAtTime([0,0,.05,.12,.22][rain],t,.6);
  AU.waterG.gain.setTargetAtTime(depth>=40?.55:depth>=15?.3:0,t,.6);
  AU.deepG.gain.setTargetAtTime(0,t,.3);
  clearInterval(AU.timer);
  if(rain>=3){AU.timer=setInterval(()=>{if(Math.random()<.55)thunder();},rain>=4?4500:7500);setTimeout(thunder,900);}
}
function stopAmbient(){if(!AU.ctx)return;clearInterval(AU.timer);const t=AU.ctx.currentTime;[AU.rainG,AU.heavyG,AU.waterG,AU.deepG].forEach(g=>g.gain.setTargetAtTime(0,t,.3));}
function thunder(){
  flash(); if(!AU.ctx)return; const ctx=AU.ctx,t=ctx.currentTime+.25;
  const s=ctx.createBufferSource();s.buffer=AU.noise;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(120,t+2.5);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+3.2);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+3.3);
}
function flash(){const f=document.querySelector(".screen.active .flash");if(!f)return;f.classList.add("on");setTimeout(()=>f.classList.remove("on"),90);setTimeout(()=>f.classList.add("on"),180);setTimeout(()=>f.classList.remove("on"),260);}
function tone(freq,start,dur,type="square",vol=.12){
  const ctx=AU.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.02);g.gain.setValueAtTime(vol,start+dur-.03);g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(AU.master);o.start(start);o.stop(start+dur);
}
function alarm(kind){
  if(!AU.ctx||!kind)return; const t=AU.ctx.currentTime+.1;
  if(["l3","l4","l5","dosha","takashio","kiroku"].includes(kind)){const n=kind==="l3"?4:6;for(let i=0;i<n;i++){tone(i%2?740:990,t+i*.32,.3,"square",kind==="l3"?.1:.13);}}
  else if(kind==="dam"){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(880,t+1.5);o.frequency.linearRampToValueAtTime(420,t+3);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.3);g.gain.linearRampToValueAtTime(0,t+3);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+3.1);}
  else if(kind==="stop"){[660,880].forEach((f,i)=>tone(f,t+i*.25,.3,"sine",.12));}
  else {[880,880,880].forEach((f,i)=>tone(f,t+i*.4,.22,"sine",.18));}
}
function heartbeat(n){if(!AU.ctx)return;const t=AU.ctx.currentTime+.05;for(let i=0;i<n;i++){tone(60,t+i*.8,.12,"sine",.5);tone(55,t+i*.8+.22,.12,"sine",.4);}}
function toggleSound(){
  AU.on=!AU.on; refreshText();
  if(AU.master)AU.master.gain.value=AU.on?1:0;
  document.querySelectorAll("video").forEach(v=>v.muted=!AU.on);
}

const W=640,H=360,G=292; let UID=0;
const ALERTC={warn:"#e8a200",l3:"#d62828",l4:"#7b2cbf",l5:"#111",stop:"#2a7fba",kaminari:"#e8a200",dosha:"#7b2cbf",takashio:"#d62828",dam:"#d62828",kiroku:"#7b2cbf",typhoon:"#e8a200"};
function rnd(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x);}
/* ふりがな対応のSVG文字 */
function segs(raw){const out=[];let re=new RegExp(RUBY_RE.source,'g'),last=0,m;while((m=re.exec(raw))){if(m.index>last)out.push({t:raw.slice(last,m.index)});out.push({t:m[1],r:m[2]});last=re.lastIndex;}if(last<raw.length)out.push({t:raw.slice(last)});return out;}
function tw(t){let w=0;for(const c of t)w+=/[\x20-\x7e]/.test(c)?0.6:1;return w;}
function svgT(x,y,raw,size,fill,anchor="start",weight="bold"){
  const sg=segs(String(raw));const total=sg.reduce((a,s)=>a+tw(s.t),0)*size;
  let cx=anchor==="middle"?x-total/2:anchor==="end"?x-total:x,out="";
  for(const s of sg){const w=tw(s.t)*size;
    out+=`<text x="${cx.toFixed(1)}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}">${esc(s.t)}</text>`;
    if(FURI&&s.r)out+=`<text x="${(cx+w/2).toFixed(1)}" y="${(y-size*.95).toFixed(1)}" font-size="${(size*.5).toFixed(1)}" fill="${fill}" text-anchor="middle" font-weight="normal">${s.r}</text>`;
    cx+=w;}
  return out;
}
function label(raw,x,y,c,blink){const w=tw(plain(raw))*18+24,h=FURI?44:34;return `<g class="${blink?'blink':''}"><rect x="${x}" y="${y-(h-34)}" width="${w}" height="${h}" rx="8" fill="${c}" stroke="#fff" stroke-width="2"/>${svgT(x+w/2,y+24,raw,18,"#fff","middle")}</g>`;}
function alertBox(k){
  if(!k)return""; const t=L[k], w=tw(plain(t))*21+60, h=FURI?56:46;
  return `<g class="${['l4','l5','dam','kiroku','dosha'].includes(k)?'blink':''}"><rect x="14" y="14" width="${w}" height="${h}" rx="10" fill="${ALERTC[k]}" stroke="#fff" stroke-width="3"/>
  <text x="30" y="${h-6}" font-size="24" fill="#fff">${k==="stop"?"☂":"⚠"}</text>${svgT(58,h-9,t,21,"#fff")}</g>`;
}

function buildSVG(sc){

  let bg=sky(sc.rain,night), body="", own=false, fg="";
  switch(sc.type){
    case "house":body=ground()+house();break;
    case "office":body=ground()+office();break;
    case "school":body=ground()+school();break;
    case "park":{const r=ex.find(e=>/^r\d$/.test(e));body=ground("park")+park(r?+r[1]:0);break;}
    case "shelter":body=ground()+shelter()+person(250,G,"#2a9d8f");break;
    case "underpass":body=underpass()+car(40,G,false);break;
    case "car":body=ground()+car(220,G+20,ex.includes("stall"));break;
    case "train":body=train(sc);break;
    case "themepark":body=ground("themepark")+themepark();break;
    case "mall":body=ground()+mall();break;
    case "underground":bg="";body=underground(sc);break;
    case "river":body=river(sc);own=true;break;
    case "mountain":body=mountain(sc);own=true;break;
    case "sea":body=sea(sc);own=true;break;
    case "camp":body=camp(sc);own=true;break;
  }
  if(sc.type==="house"&&!ex.length&&sc.depth<50)fg+=person(250,G)+(sc.rain?umbrella(250,G):"");
  if(sc.type==="office"&&!ex.length)fg+=person(260,G,"#264653");
  if(sc.type==="school")fg+=person(220,G,"#e76f51",.8)+person(180,G,"#2a9d8f",.85);
  if(sc.type==="themepark")fg+=person(330,G,"#e76f51",.8)+person(360,G,"#264653")+(sc.rain?umbrella(360,G):"");
  if(sc.type==="mall")fg+=person(300,G,"#264653");
  if(sc.type==="underground"&&!ex.includes("car"))fg+=person(300,G,"#ff8a00");
  if(sc.type==="park"&&!ex.includes("walker"))fg+=person(230,G,"#e76f51",.85);
  if(ex.includes("walker"))fg+=person(230,G)+`<line x1="246" y1="${G-50}" x2="262" y2="${G+4}" stroke="#333" stroke-width="3"/>`;
  if(ex.includes("grandma"))fg+=grandma();

  if(ex.includes("breaker"))fg+=breaker();

}

    const anim=()=>{
      el.innerHTML=pass?happySVG():badSVG();
      if(AU.ctx){const t=AU.ctx.currentTime;clearInterval(AU.timer);AU.rainG.gain.setTargetAtTime(0,t,.4);AU.heavyG.gain.setTargetAtTime(0,t,.4);
        if(pass){AU.waterG.gain.setTargetAtTime(.12,t,.8);[523,659,784,659,784,1047].forEach((f,i)=>tone(f,t+.4+i*.22,.3,"triangle",.12));}
        else{AU.waterG.gain.setTargetAtTime(0,t,.3);AU.deepG.gain.setTargetAtTime(.9,t,.5);[110,104,98].forEach((f,i)=>tone(f,t+.3+i*1.6,1.5,"sine",.25));}}
    };
    const v=VIDEOS[pass?"happy":"bad"]; if(v){stopAmbient();playVideo(el,v,anim);} else anim();
  },DRAMA_FLOOD_MS));
  dramaTimers.push(setTimeout(()=>{stopAmbient();done();},DRAMA_FLOOD_MS+DRAMA_END_MS));
}
let curScene=null;
function showScene(el,sc,videoSrc){
  curScene=sc;
  el.classList.toggle("shake",sc.depth>=40&&sc.rain>=4);
  if(videoSrc){
    el.innerHTML=`<video playsinline loop preload="auto" src="${videoSrc}"></video>`;
    const v=el.querySelector("video"); v.muted=!AU.on;
    v.onerror=()=>{el.innerHTML=buildSVG(sc);setAmbient(sc.rain,sc.depth);alarm(sc.alert);};
    stopAmbient(); const p=v.play(); if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});
  }else{ el.innerHTML=buildSVG(sc); setAmbient(sc.rain,sc.depth); alarm(sc.alert); }
}

/* =========================================================
   画面制御（分岐型ストーリー）
   1問目 → 選んだ選択肢（最善g／次善m／危険b）に応じて次の問題が変わる
   ========================================================= */
let LV="easy",cur=null,stage=1,nodeKey="1",path=[];
const HERO={type:"house",rain:4,depth:30,alert:"warn",extra:[]};
function go(id,keepSound){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0);
  document.querySelectorAll(".screen:not(.active) video").forEach(v=>v.pause());
  if(id!=="s-drama"){dramaTimers.forEach(clearTimeout);dramaTimers=[];}
  if(id!=="s-quiz"&&!keepSound)stopAmbient();
  if(id==="s-start")document.body.classList.remove("oni");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function chooseLevel(lv){
  audioInit(); LV=lv; const U=UI[lv];
  document.body.classList.toggle("oni",lv==="oni");
  const tag=document.getElementById("sel-tag"); setT(tag,U.tag); tag.style.background={easy:"#38b000",hard:"#d62828",oni:"#000"}[lv]; tag.style.border=lv==="oni"?"2px solid #ff2a2a":"none";
  setT("sel-h",U.selH); setT("sel-sub",U.selSub); setT("sel-back",U.back); setT("r-h3",U.h3); setT("r-again",U.again); setT("r-top",U.top);
  document.getElementById("sc-grid").innerHTML=DATA[lv].map((s,i)=>
    `<button class="sc-btn" onclick="startQuiz(${i})"><div class="ic">${s.icon}</div><div class="t" data-raw="${esc(s.title)}">${rb(s.title)}</div><div class="d" data-raw="${esc(s.desc)}">${rb(s.desc)}</div></button>`).join("");
  go("s-select");
}
function startQuiz(i){audioInit();cur=DATA[LV][i];stage=1;nodeKey="1";path=[];go("s-quiz");render();}
function render(){
  const n=cur.nodes[nodeKey],U=UI[LV];
  setT("q-sc",`${cur.icon} ${cur.title}`);
  setT("q-no",U.qno.replace("{i}",stage).replace("{n}",5));
  document.getElementById("q-bar").style.width=`${(stage-1)/5*100}%`;
  showScene(document.getElementById("q-scene"),n.scene,VIDEOS[`${cur.id}-${nodeKey}`]);
  setT("q-sit",n.sit); setT("q-text","Q. "+n.q);
  const lbs=["A","B","C"];
  document.getElementById("q-choices").innerHTML=shuffle([0,1,2]).map((ci,k)=>
    `<button class="choice" data-i="${ci}"><span class="lb">${lbs[k]}</span><span data-raw="${esc(n.c[ci].t)}">${rb(n.c[ci].t)}</span></button>`).join("");
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  window.scrollTo(0,0);
}
function pick(ci){
  audioInit();
  const n=cur.nodes[nodeKey], c=n.c[ci];
  path.push({n,c});
  if(stage<5){ stage++; nodeKey=stage+["b","m","g"][c.s]; render(); }
  else showResult();
}
function showResult(){
  const U=UI[LV], score=path.reduce((a,x)=>a+x.c.s*10,0), pass=score>=PASS[LV];
  const head=document.getElementById("r-head"); head.className="result-head "+(pass?"pass":"fail");
  head.innerHTML=`<div style="font-size:20px" data-raw="${esc(cur.icon+' '+cur.title)}">${rb(cur.icon+' '+cur.title)}</div>
   <div class="score">${score}<small> / 100<span data-raw="${esc(U.unit)}">${rb(U.unit)}</span></small></div>
   <div class="verdict" data-raw="${esc(pass?(score===100?U.perfect:U.ok):U.ng)}">${rb(pass?(score===100?U.perfect:U.ok):U.ng)}</div>
   <div class="warn" data-raw="${esc(pass?U.okMsg:U.ngMsg)}">${rb(pass?U.okMsg:U.ngMsg)}</div>`;
  const mk={2:["g","○"],1:["m","△"],0:["b","×"]};
  document.getElementById("r-list").innerHTML=path.map(({n,c},i)=>{
    const best=n.c.find(x=>x.s===2).t,[cls,sym]=mk[c.s];
    const line1=`${U.qno.replace("{i}",i+1).replace(" / {n}","")}：${U.ans}「${c.t}」（${c.s*10}${U.unit}）`;
    const line2=c.s===2?`<span style="color:#1e9e5a">${U.correct}</span> ${n.tip}`:`<span class="adv">▶ ${U.best}：「${best}」</span><br>${LV==="easy"?"💡 ":""}${n.tip}`;
    return `<div class="rv"><div class="mk ${cls}">${sym}</div><div><span class="sit" data-raw="${esc(n.sit.replace(/<[^>]+>/g,''))}">${rb(n.sit.replace(/<[^>]+>/g,''))}</span><b data-raw="${esc(line1)}">${rb(line1)}</b><br><span data-raw="${esc(line2)}">${rb(line2)}</span></div></div>`;}).join("");
  document.getElementById("q-bar").style.width="100%";
  playDrama(pass,()=>{ go("s-result"); if(AU.ctx){const t=AU.ctx.currentTime+.1;(pass?[523,659,784,1047]:[392,330,262]).forEach((f,i)=>tone(f,t+i*.18,.25,"sine",.15));} });
}

/* 初期表示 */
document.getElementById("hero").innerHTML=buildSVG(HERO);
refreshText();
</script>
